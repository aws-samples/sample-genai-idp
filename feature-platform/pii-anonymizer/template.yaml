AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  pii-anonymizer v<FEATURE_VERSION_TOKEN> — PII Anonymization extension for the
  IDP Accelerator. Adds a `preprocessing` pipeline hook that detects and redacts
  PII from source documents BEFORE the classification/extraction models see them,
  writing a de-identified copy that is re-processed under a companion config
  version. Reuses the vendored AWS Labs pii-anonymizer document closure
  (Apache-2.0). Ships a minimal preprocessing config preset and a two-tab UI
  (Config Pairing wizard + Redaction Report).

Parameters:

  MainStackName:
    Type: String

  # Version is baked in at publish time (see sample-health-insurance-review
  # template for the rationale — CFN Console "Update" drops param overrides).

  FeatureId:
    Type: String
    Default: pii-anonymizer

  FeatureDisplayName:
    Type: String
    Default: "PII Anonymization"

  FeatureBucket:
    Type: String
    Description: S3 bucket holding this version's artifacts (host artifacts bucket
      for OSS). The ui-deployer copies the UI bundle and config preset from here.
      Pre-filled by the host's getFeatureLaunchUrl.

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]

  RedactedPrefix:
    Type: String
    Default: "_pii_redacted/"
    Description: Reserved key prefix under the Input bucket for redacted copies.
      The hook refuses to run on any object under this prefix (infinite-loop
      guard). Must end with a slash.

  PermissionsBoundaryArn:
    Type: String
    Default: ''
    Description: Optional IAM permissions boundary ARN applied to created roles.

Conditions:
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, '']]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 256
    Tracing: Active
    Architectures: [arm64]

Resources:

  ###########################################################################
  # Lambda layer — vendored pii-anonymizer document closure dependencies
  # (pypdf, pypdfium2, pillow, python-docx, openpyxl, faker, defusedxml,
  # PyYAML). Built by SAM from hook/requirements.txt.
  ###########################################################################
  PiiDepsLayer:
    Type: AWS::Serverless::LayerVersion
    Metadata:
      BuildMethod: python3.12
      BuildArchitecture: arm64
    Properties:
      LayerName: !Sub '${MainStackName}-pii-anonymizer-deps'
      Description: Vendored pii-anonymizer document-closure dependencies.
      ContentUri: hook/
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [arm64]
      RetentionPolicy: Delete

  ###########################################################################
  # Redaction audit table — OWNED by this feature. One row per redacted
  # document (metadata only, NO PII): pii_count, mode, redacted key, companion
  # version. Populated by the hook; read by the feature API for the Redaction
  # Report tab. GSI ByCreatedAt for the report list.
  ###########################################################################
  RedactionAuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: documentId
          AttributeType: S
        - AttributeName: gsiPk
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: documentId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ByCreatedAt
          KeySchema:
            - AttributeName: gsiPk
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: 'idp:feature-id'
          Value: !Ref FeatureId

  ###########################################################################
  # Preprocessing hook — invoked FIRST by the host's pipeline-hooks dispatcher
  # (before BDA/pipeline routing). The dispatcher only invokes Lambdas tagged
  # `idp:feature-id` — the Tags below are REQUIRED. Heavy timeout/memory:
  # vision/LLM detection over a multi-page document is expensive.
  ###########################################################################
  PiiAnonymizerHookFunction:
    Type: AWS::Serverless::Function
    Properties:
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue']
      CodeUri: hook/
      Handler: handler.lambda_handler
      Timeout: 900
      MemorySize: 3008
      Layers:
        - !Ref PiiDepsLayer
      Tags:
        'idp:feature-id': !Ref FeatureId
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          REDACTED_PREFIX: !Ref RedactedPrefix
          AUDIT_TABLE_NAME: !Ref RedactionAuditTable
          INPUT_BUCKET: { 'Fn::ImportValue': !Sub '${MainStackName}-InputBucketName' }
          WORKING_BUCKET: { 'Fn::ImportValue': !Sub '${MainStackName}-WorkingBucketName' }
          CONFIGURATION_TABLE_NAME: { 'Fn::ImportValue': !Sub '${MainStackName}-ConfigurationTableName' }
      Policies:
        - Statement:
            # Read the config version's preprocessing block.
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: { 'Fn::ImportValue': !Sub '${MainStackName}-ConfigurationTableArn' }
            # Record the redaction audit row (metadata only).
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt RedactionAuditTable.Arn
            # Read the source document from Input; read compressed document
            # state + write the redaction scratch output in Working.
            - Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub
                  - 'arn:${AWS::Partition}:s3:::${Bucket}/*'
                  - Bucket: { 'Fn::ImportValue': !Sub '${MainStackName}-InputBucketName' }
                - !Sub
                  - 'arn:${AWS::Partition}:s3:::${Bucket}/*'
                  - Bucket: { 'Fn::ImportValue': !Sub '${MainStackName}-WorkingBucketName' }
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub
                - 'arn:${AWS::Partition}:s3:::${Bucket}/pii_scratch/*'
                - Bucket: { 'Fn::ImportValue': !Sub '${MainStackName}-WorkingBucketName' }
            # Write the redacted copy ONLY under the reserved prefix in Input.
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub
                - 'arn:${AWS::Partition}:s3:::${Bucket}/${RedactedPrefix}*'
                - Bucket: { 'Fn::ImportValue': !Sub '${MainStackName}-InputBucketName' }
                  RedactedPrefix: !Ref RedactedPrefix
            # Bedrock Converse for PII detection + synthetic generation.
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/*'
                - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*'
                - !Sub 'arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*'
            # Textract for the scanned/image redaction path.
            - Effect: Allow
              Action:
                - textract:DetectDocumentText
                - textract:AnalyzeDocument
              Resource: '*'
            # Both buckets + config table are encrypted with the main stack's
            # customer-managed KMS key; S3/DDB require kms:Decrypt (and Encrypt
            # for the PutObject) transparently.
            - Effect: Allow
              Action:
                - kms:Decrypt
                - kms:GenerateDataKey
                - kms:DescribeKey
              Resource:
                'Fn::ImportValue': !Sub '${MainStackName}-CustomerManagedEncryptionKeyArn'

  ###########################################################################
  # Feature API: HttpApi + Lambda, authorized by main stack's Cognito User
  # Pool. Serves the Redaction Report tab (reads the audit table).
  ###########################################################################
  FeatureApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [authorization, content-type, x-amz-date, x-amz-security-token]
        MaxAge: 600
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            JwtConfiguration:
              issuer: !Sub
                - 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${UserPoolId}'
                - UserPoolId: { 'Fn::ImportValue': !Sub '${MainStackName}-UserPoolId' }
              audience:
                - !Sub
                  - '${ClientId}'
                  - ClientId: { 'Fn::ImportValue': !Sub '${MainStackName}-UserPoolClientId' }
            IdentitySource: '$request.header.Authorization'

  FeatureApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue']
      CodeUri: feature-api/
      Handler: handler.lambda_handler
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          MAIN_STACK_NAME: !Ref MainStackName
          AUDIT_TABLE_NAME: !Ref RedactionAuditTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !GetAtt RedactionAuditTable.Arn
                - !Sub '${RedactionAuditTable.Arn}/index/*'
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref FeatureApi
            Path: /{proxy+}
            Method: GET

  ###########################################################################
  # CloudWatch Log Groups — explicit retention.
  ###########################################################################
  PiiAnonymizerHookFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${PiiAnonymizerHookFunction}'
      RetentionInDays: 30

  FeatureApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${FeatureApiFunction}'
      RetentionInDays: 30

  UiDeployerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${UiDeployerFunction}'
      RetentionInDays: 30

  ###########################################################################
  # UI deployer: copies the UMD bundle, registers the feature, and applies the
  # bundled preprocessing config preset (injecting this feature's preprocessing
  # hook into the preset's preprocessing.preHook).
  ###########################################################################
  UiDeployerRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue']
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: !Sub "lambda.${AWS::URLSuffix}" }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Tags:
        - Key: 'idp:feature-id'
          Value: !Ref FeatureId
      Policies:
        - PolicyName: ReadFeatureBucket
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${FeatureBucket}/<FEATURE_ARTIFACT_PREFIX_TOKEN>/*'
        - PolicyName: WriteWebUIBucketPrefix
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectAcl
                  - s3:DeleteObject
                Resource: !Sub
                  - 'arn:${AWS::Partition}:s3:::${Bucket}/features/${FeatureId}/*'
                  - Bucket: { 'Fn::ImportValue': !Sub '${MainStackName}-WebUIBucketName' }
        - PolicyName: InvokeHostResolvers
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - { 'Fn::ImportValue': !Sub '${MainStackName}-RegisterFeatureFunctionArn' }
                  - { 'Fn::ImportValue': !Sub '${MainStackName}-RegisterFeatureHooksFunctionArn' }
                  - { 'Fn::ImportValue': !Sub '${MainStackName}-ApplyFeatureConfigPresetFunctionArn' }

  UiDeployerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ui-deployer/
      Handler: handler.lambda_handler
      Role: !GetAtt UiDeployerRole.Arn
      Environment:
        Variables:
          FEATURE_ID: !Ref FeatureId
          FEATURE_DISPLAY_NAME: !Ref FeatureDisplayName
          FEATURE_VERSION: '<FEATURE_VERSION_TOKEN>'
          MAIN_STACK_NAME: !Ref MainStackName
          WEBUI_BUCKET: { 'Fn::ImportValue': !Sub '${MainStackName}-WebUIBucketName' }
          FEATURE_BUCKET: !Ref FeatureBucket
          FEATURE_ARTIFACT_PREFIX: '<FEATURE_ARTIFACT_PREFIX_TOKEN>'
          REGISTER_FEATURE_FUNCTION_ARN: { 'Fn::ImportValue': !Sub '${MainStackName}-RegisterFeatureFunctionArn' }
          REGISTER_FEATURE_HOOKS_FUNCTION_ARN: { 'Fn::ImportValue': !Sub '${MainStackName}-RegisterFeatureHooksFunctionArn' }
          APPLY_FEATURE_CONFIG_PRESET_FUNCTION_ARN: { 'Fn::ImportValue': !Sub '${MainStackName}-ApplyFeatureConfigPresetFunctionArn' }
          FEATURE_API_ENDPOINT: !GetAtt FeatureApi.ApiEndpoint
          HOOK_FUNCTION_ARN: !GetAtt PiiAnonymizerHookFunction.Arn
          CONFIG_PRESET_RELATIVE_KEY: config-preset/pii-preprocessing.yaml
          LOG_LEVEL: !Ref LogLevel

  RegisterFeatureResource:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt UiDeployerFunction.Arn
      FeatureVersion: '<FEATURE_VERSION_TOKEN>'
      FeatureDisplayName: !Ref FeatureDisplayName

Outputs:
  FeatureApiEndpoint:
    Value: !GetAtt FeatureApi.ApiEndpoint
  RedactionAuditTableName:
    Value: !Ref RedactionAuditTable
  PiiAnonymizerHookFunctionArn:
    Value: !GetAtt PiiAnonymizerHookFunction.Arn
  InstalledVersion:
    Value: '<FEATURE_VERSION_TOKEN>'
