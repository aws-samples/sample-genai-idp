# Repo-root pytest config. Deliberately minimal: it registers ONLY the shared
# test markers so per-Lambda suites that have no pytest.ini of their own stop
# emitting `PytestUnknownMarkWarning: Unknown pytest.mark.unit`. Packages with
# their own config (e.g. lib/idp_common_pkg) resolve to that closer file and are
# unaffected. Intentionally NO addopts/filterwarnings here — that would silently
# change collection for every such suite.
[pytest]
markers =
    unit: mark a test as a unit test
    integration: mark a test as an integration test
