discovery:
  without_ground_truth:
    model_id: us.amazon.nova-pro-v1:0
    system_prompt: You are an expert in processing forms. Extracting data from images and documents. Analyze forms line by
      line to identify field names, data types, and organizational structure. Focus on creating comprehensive blueprints for
      document processing without extracting actual values.
    temperature: 0.0
    top_p: 0.1
    max_tokens: 10000
    user_prompt: 'This image contains forms data. Analyze the form line by line. Image may contain multiple pages, process
      all the pages. Form may contain multiple name value pair in one line. Extract all the names in the form including the
      name value pair which doesn''t have value. Organize them into groups, extract field_name, data_type and field description.
      Field names should be less than 30 characters, use camelCase or snake_case, name should not start with number and name
      should not have special characters. Field descriptions should include location hints (box number, line number, section).
      Field_name should be unique within the group. Make sure to fill out the top-level "$id" and "x-aws-idp-document-type"
      with the extracted document class, and the top-level "description" with a brief description of the document class. Group
      the fields based on the section they are grouped in the form. Group should have attributeType as "group". Nesting Groups:
      Do not nest the groups i.e. groups within groups. All groups should be directly associated under main "properties".
      If the group repeats and follows table format, update the attributeType as "list". Do not extract the values. Return
      the extracted data in JSON format. Format the extracted data using the below JSON format: Format the extracted groups
      and fields using the below JSON format:'
  with_ground_truth:
    model_id: us.amazon.nova-pro-v1:0
    system_prompt: You are an expert in processing forms. Extracting data from images and documents. Use provided ground truth
      data as reference to optimize field extraction and ensure consistency with expected document structure and field definitions.
    temperature: 0.0
    top_p: 0.1
    max_tokens: 10000
    user_prompt: 'This image contains unstructured data. Analyze the data line by line using the provided ground truth as
      reference. <GROUND_TRUTH_REFERENCE> {ground_truth_json} </GROUND_TRUTH_REFERENCE> Ground truth reference JSON has the
      fields we are interested in extracting from the document/image. Use the ground truth to optimize field extraction. Match
      field names, data types, and groupings from the reference. Image may contain multiple pages, process all pages. Extract
      all field names including those without values. Do not change the group name and field name from ground truth in the
      extracted data json. Add field_description field for every field which will contain instruction to LLM to extract the
      field data from the image/document. Add data_type field for every field. Make sure to fill out the top-level "$id" and
      "x-aws-idp-document-type" with the extracted document class, and the top-level "description" with a brief description
      of the document class. Nesting Groups: Do not nest the groups i.e. groups within groups. All groups should be directly
      associated under main "properties". If the group repeats and follows table format, update the attributeType as "list".
      Do not extract the values. Format the extracted data using the below JSON format: Format the extracted groups and fields
      using the below JSON format:'
  auto_split:
    model_id: us.anthropic.claude-opus-4-6-v1:1m
    system_prompt: You are an expert document analyst. Your task is to identify distinct document sections within a multi-page
      document package. Return only valid JSON.
    temperature: 0.0
    top_p: 0.1
    max_tokens: 4096
    user_prompt: 'Analyze this multi-page document package. Identify the page boundaries where different document types or
      sections begin and end. For each distinct document section, provide: - "start": the first page number (1-based) - "end":
      the last page number (1-based) - "type": a short label for the document type (e.g., "W2 Form", "Letter", "Invoice")
      Return ONLY a JSON array, no other text: [{"start": 1, "end": 2, "type": "Letter"}, {"start": 3, "end": 3, "type": "Invoice"}]'
  multi_document:
    embedding_model_id: us.cohere.embed-v4:0
    analysis_model_id: us.anthropic.claude-sonnet-4-6
    temperature: 0.0
    max_tokens: 10000
    max_documents: 500
    min_cluster_size: 2
    num_sample_documents: 3
    max_sample_size: 5
    max_concurrent_embeddings: 5
    max_concurrent_clusters: 3
    system_prompt: ''
  rules:
    model: global.anthropic.claude-sonnet-4-6
    system_prompt: You are an expert in analyzing policy documents and extracting business rules, regulations, and compliance
      requirements. Extract rules as structured, actionable validation statements.
    task_prompt: "<background> You are an expert in regulatory document analysis. Your task is to extract ALL business rules,\
      \ regulations, compliance requirements, and validation criteria from the attached policy document as a single flat list\
      \ of rules. </background>\n<task> Analyze the policy document thoroughly, page by page. For each rule found:\n1. Give\
      \ the rule a short, descriptive snake_case name (e.g., \"bundled_services_not_separate\",\n   \"modifier_59_distinct_sites\"\
      , \"prior_auth_required\")\n\n2. Write a clear, actionable description — phrased as a yes/no validation question\n \
      \  or checkable statement\n\n3. Include specific codes, numbers, thresholds, or conditions mentioned\n4. Note any exceptions\
      \ or special cases within the description\n5. Reference the page number or section where the rule was found </task>\n\
      <extraction-guidelines> Guidelines: - Extract rules VERBATIM from the document where possible - Each rule should be\
      \ a self-contained, evaluable statement - Rules should be specific enough to validate a transaction against - Do NOT\
      \ classify or categorize the rules — output one flat list - Use descriptive snake_case names as rule identifiers (NOT\
      \ generic \"rule_1\", \"rule_2\") - Each rule description should be phrased as a validation question or checkable statement\
      \ - Do NOT interpret or infer rules not explicitly stated in the document - Process ALL pages of the document - If a\
      \ rule has exceptions, include them in the description </extraction-guidelines>\n<output-format> Return ONLY a valid\
      \ JSON array containing exactly ONE object. All rules go into a single \"rule_properties\" dict with descriptive snake_case\
      \ keys:\n[\n    {\n        \"x-aws-idp-rule-type\": \"policy_rules\",\n        \"description\": \"All rules extracted\
      \ from the policy document\",\n        \"rule_properties\": {\n            \"bundled_services_not_separate\": {\n  \
      \              \"description\": \"Are bundled services (exploration, lysis of adhesions, closure, anesthesia) NOT reported\
      \ separately from the primary surgical procedure?\",\n                \"page\": \"V-5\"\n            },\n          \
      \  \"modifier_59_distinct_sites\": {\n                \"description\": \"Is modifier 59 used only when procedures are\
      \ performed at distinctly different anatomic sites or during separate patient encounters?\",\n                \"page\"\
      : \"V-8\"\n            },\n            \"prior_auth_required\": {\n                \"description\": \"Has prior authorization\
      \ been obtained before performing procedures that require pre-approval per the policy?\",\n                \"page\"\
      : \"III-4\"\n            },\n            \"medical_necessity_documented\": {\n                \"description\": \"Is\
      \ medical necessity documentation included to support the procedure performed?\",\n                \"page\": \"IV-1\"\
      \n            }\n        }\n    }\n] </output-format>\n<final-instructions> Extract rules from the attached policy document\
      \ by: 1. Reading every page systematically to identify all stated rules 2. Giving each rule a short, descriptive snake_case\
      \ name 3. Phrasing each rule as a yes/no validation question 4. Including page references for traceability 5. Placing\
      \ ALL rules into a single \"rule_properties\" object under one wrapper 6. Do NOT include any text outside the JSON array\
      \ - return ONLY valid JSON </final-instructions>"
    temperature: 0.0
    top_p: 0.0
    top_k: 5.0
    max_tokens: 64000
    agentic:
      enabled: false
      review_agent: false
      review_agent_model: global.anthropic.claude-sonnet-4-6
evaluation:
  enabled: true
  llm_method:
    top_p: 0.0
    max_tokens: 4096
    top_k: 5.0
    task_prompt: "I need to evaluate attribute extraction for a document of class: {DOCUMENT_CLASS}. For the attribute named\
      \ \"{ATTRIBUTE_NAME}\" described as \"{ATTRIBUTE_DESCRIPTION}\": - Expected value: {EXPECTED_VALUE} - Actual value:\
      \ {ACTUAL_VALUE} Do these values match in meaning, taking into account formatting differences, word order, abbreviations,\
      \ and semantic equivalence? Provide your assessment as a JSON with three fields: - \"match\": boolean (true if they\
      \ match, false if not) - \"score\": number between 0 and 1 representing the confidence/similarity score - \"reason\"\
      : brief explanation of your decision Respond ONLY with the JSON and nothing else. Here's the exact format: {\n  \"match\"\
      : true or false,\n  \"score\": 0.0 to 1.0,\n  \"reason\": \"Your explanation here\"\n}"
    temperature: 0.0
    model: us.amazon.nova-2-lite-v1:0
    system_prompt: You are an evaluator that helps determine if the predicted and expected values match for document attribute
      extraction. You will consider the context and meaning rather than just exact string matching.
