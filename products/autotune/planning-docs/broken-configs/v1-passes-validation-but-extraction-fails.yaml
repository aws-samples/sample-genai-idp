      properties:
        passedInspection:
          type: boolean
          description: Whether the equipment passed the overall inspection
          data_type: boolean
          field_description: Determine if the inspection result is passed (true) or failed (false) based on the 'Inspection
            Result:' checkbox in the 'Overall Status' section
        nextInspectionDue:
          type: string
          description: Date when the next inspection is due
          data_type: date
          field_description: Extract the next inspection due date from the 'Overall Status' section labeled 'Next Inspection
            Due:' in YYYY-MM-DD format
