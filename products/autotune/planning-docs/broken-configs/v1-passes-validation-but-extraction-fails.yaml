          type: string
      type: object
  type: object
  x-aws-idp-document-type: COMMERCIAL_LEASE_AGREEMENT
- $schema: https://json-schema.org/draft/2020-12/schema
  $id: PETITION_FORM
  x-aws-idp-document-type: PETITION_FORM
  type: object
  description: Democratic Designating Petition form for nominating candidates for public office in New York State
  properties:
    header:
      type: object
      description: Header information of the petition form
      properties:
        state:
          type: string
          description: The state where the petition is filed, extracted from the county/state line below the title
          field_description: Extract the state name from the 'COUNTY OF [county], STATE OF [state]' line
          data_type: string
        title:
          type: string
          description: The title of the petition document
          field_description: Extract the main title/heading of the document in bold at the top
          data_type: string
        county:
          type: string
          description: The county where the petition is filed
          field_description: Extract the county name from the 'COUNTY OF [county], STATE OF [state]' line
          data_type: string
        electionDate:
          type: string
          description: The date of the primary election referenced in the petition
          field_description: Extract the election date mentioned in the introductory paragraph, formatted as YYYY-MM-DD
          data_type: string
    witness:
      type: object
      description: Statement of witness information
      properties:
        date:
          type: string
          description: The date the witness signed the petition
          field_description: Extract the date from the 'Date:' field in the Statement of Witness section, formatted as YYYY-MM-DD
          data_type: string
        name:
          type: string
          description: The printed name of the witness
          field_description: Extract the witness name from 'I, (print name) [name]' in the Statement of Witness section
          data_type: string
        residence:
          type: string
          description: The residence address of the witness
          field_description: Extract the witness residence from 'reside at [address]' in the Statement of Witness section
          data_type: string
    candidate:
      type: object
      description: Information about the candidate being nominated
      properties:
        name:
          type: string
          description: The name of the candidate
          field_description: Extract the candidate name from the 'NAME OF CANDIDATE' column in the candidate table
          data_type: string
        position:
          type: string
          description: The public office or party position the candidate is nominated for
          field_description: Extract the position from the 'PUBLIC OFFICE OR PARTY POSITION' column in the candidate table
          data_type: string
        residence:
          type: string
          description: The place of residence of the candidate
          field_description: Extract the residence from the 'PLACE OF RESIDENCE' column in the candidate table
          data_type: string
    signatures:
      type: array
      description: List of enrolled electors who signed the petition
      items:
        type: object
        properties:
          date:
            type: string
            description: The date the elector signed the petition
            field_description: Extract the date from the 'DATE' column for each signer row, formatted as YYYY-MM-DD
            data_type: string
          town:
            type: string
            description: The town or city of the elector
            field_description: Extract the town or city from the 'TOWN OR CITY' column for each signer row
            data_type: string
          printName:
            type: string
            description: The printed name of the elector
            field_description: Extract the printed name from the 'PRINTED NAME OF ELECTOR' column for each signer row
            data_type: string
          residence:
            type: string
            description: The residence address of the elector
            field_description: Extract the residence address from the 'RESIDENCE' column for each signer row
            data_type: string
- $schema: https://json-schema.org/draft/2020-12/schema
  $id: REAL_ESTATE
  x-aws-idp-document-type: REAL_ESTATE
  type: object
  description: Real Estate Market Dynamics document containing transaction data by city and quarterly transaction counts by
    category
  properties:
    transactions:
      type: array
      description: Quarterly transaction counts by category extracted from the bar chart
      items:
        type: object
        properties:
          value:
            type: number
            description: The transaction count value shown on the bar chart for the given quarter and category
            data_type: number
            field_description: Extract the numeric value displayed above each bar in the bar chart representing the number
              of transactions
          period:
            type: string
            description: The quarter and year period in format Q#-YYYY from the x-axis of the bar chart
            data_type: string
            field_description: Extract the quarter label from the x-axis of the bar chart (e.g., Q1-2023, Q2-2023, Q3-2023,
              Q4-2023)
          category:
            type: string
            description: The category grouping for the transactions such as Commercial Office, State & Federal Contruction,
              Retail, or Hospitality
            data_type: string
            field_description: Extract the category name that corresponds to the color-coded group of bars in the chart (Commercial
              Office, State & Federal Contruction, Retail, Hospitality)
    transactionsByCity:
      type: array
      description: Transaction totals by city extracted from the table
      items:
        type: object
        properties:
          city:
            type: string
            description: The city name from the City column in the table
            data_type: string
            field_description: Extract the city name from the first column of the table (e.g., San Diego, Los Angeles, New
              York, Columbus)
          year:
            type: string
            description: The year from the Year column in the table
            data_type: string
            field_description: Extract the year value from the Year column in the table
          value:
            type: number
            description: The numeric value of total transactions from the Transactions (Total) column, expressed in millions
              without the dollar sign and M suffix
            data_type: number
            field_description: Extract the numeric value from the Transactions (Total) column in the table, removing the dollar
              sign and 'M' suffix (e.g., $162M becomes 162)
- $id: CREDIT_CARD_STATEMENT
  $schema: https://json-schema.org/draft/2020-12/schema
  description: Bank deposit and withdrawal log statement showing account transactions over a specified period
  properties:
    accountNumber:
      data_type: string
      description: The account number displayed near the top of the statement
      type: string
    period:
      description: Statement period date range
      properties:
        end:
          data_type: string
          description: End date of the statement period (e.g., April 30, 2017). Keep the original format from the document.
          type: string
        start:
          data_type: string
          description: Start date of the statement period (e.g., February 1, 2017). Keep the original format from the document.
          type: string
      type: object
    transactions:
      description: List of all deposit and withdrawal transactions
      items:
        properties:
          date:
            data_type: string
            description: Transaction date in MM/DD format from the DATE column
            type: string
          deposit:
            data_type: number
            description: Deposit amount. Extract dollar amount if positive, else 0
            type: number
          description:
            data_type: string
            description: Transaction description from DESCRIPTION column
            type: string
          total:
            data_type: number
            description: 'Net total: positive for deposits, negative for withdrawals'
            type: number
          withdrawal:
            data_type: number
            description: Withdrawal amount. Extract dollar amount if withdrawal, else 0
            type: number
        type: object
      type: array
  type: object
  x-aws-idp-document-type: CREDIT_CARD_STATEMENT
