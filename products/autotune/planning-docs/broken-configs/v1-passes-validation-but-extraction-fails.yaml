- $schema: https://json-schema.org/draft/2020-12/schema
  $id: GLOSSARY
  x-aws-idp-document-type: GLOSSARY
  type: object
  description: Glossary document containing terms organized alphabetically by letter sections, with a title and page number
  properties:
    title:
      type: string
      description: The title of the glossary document at the top of the page
      data_type: string
    pageNumber:
      type: number
      description: The page number shown on the document
      data_type: number
    glossarySections:
      type: array
      description: Alphabetical sections of the glossary grouped by starting letter
      items:
        type: object
        properties:
          letter:
            type: string
            description: The letter or number heading for this section
            data_type: string
          terms:
            type: array
            description: List of glossary terms under this letter
            items:
              type: object
              properties:
                term:
                  type: string
                  description: The glossary term name shown in bold
                  data_type: string
- $id: COMMERCIAL_LEASE_AGREEMENT
  $schema: https://json-schema.org/draft/2020-12/schema
  description: Commercial Lease Agreement between a lessor and lessee for leasing commercial premises
  properties:
    date:
      data_type: string
      description: The date the lease agreement was made, formatted as YYYY-MM-DD
      type: string
    rent:
      description: Rent payment details
      properties:
        monthlyAmount:
          data_type: number
          description: Net monthly payment amount in dollars from BASE RENT section
          type: number
        securityDeposit:
          data_type: number
          description: Security deposit amount in dollars from BASE RENT section
          type: number
      type: object
    lease:
      description: Lease term details
      properties:
        years:
          data_type: number
          description: Number of years for the lease term
          type: number
        months:
          data_type: number
          description: Number of additional months for the lease term
          type: number
        startDate:
          data_type: string
          description: Lease start date in YYYY-MM-DD format
          type: string
        endDate:
          data_type: string
          description: Lease end date in YYYY-MM-DD format
          type: string
      type: object
    lessee:
      description: Information about the lessee (tenant)
      properties:
        name:
          data_type: string
          description: Name of the lessee
          type: string
        streetAddress:
          data_type: string
          description: Street address of the lessee
          type: string
        state:
          data_type: string
          description: State of the lessee
          type: string
      type: object
    lessor:
      description: Information about the lessor (property owner)
      properties:
        name:
          data_type: string
          description: Name of the lessor
          type: string
        streetAddress:
          data_type: string
          description: Street address of the lessor
          type: string
        state:
          data_type: string
          description: State of the lessor
          type: string
      type: object
    premises:
      description: Description of the leased premises
      properties:
        spaceType:
          data_type: string
          description: Type of space being leased (e.g., Office Space, Retail Space)
          type: string
        squareFeet:
          data_type: string
          description: Square footage of the leased premises as a string
          type: string
