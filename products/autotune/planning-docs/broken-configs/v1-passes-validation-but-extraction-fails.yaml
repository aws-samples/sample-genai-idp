          field_description: Extract the equipment ID value from the header section labeled 'Equipment ID:'
        model:
          type: string
          description: Model name and manufacturer of the equipment
          data_type: string
          field_description: Extract the model value from the header section labeled 'Model:'
        department:
          type: string
          description: Department where the equipment is located
          data_type: string
          field_description: Extract the department value from the header section labeled 'Department:'
        inspectionDate:
          type: string
          description: Date when the inspection was performed
          data_type: date
          field_description: Extract the inspection date from the header section labeled 'Inspection Date:' in YYYY-MM-DD
            format
    checkpoints:
      type: array
      description: Categories of inspection checkpoints including Physical Condition, Electrical Safety, and Performance Tests
      items:
        type: object
        properties:
          category:
            type: string
            description: The category name of the checkpoint section
            data_type: string
            field_description: Extract the section heading name such as 'Physical Condition', 'Electrical Safety', or 'Performance
              Tests'
          items:
            type: array
            description: Individual checkpoint items within a category
            items:
              type: object
              properties:
                checkpoint:
                  type: string
