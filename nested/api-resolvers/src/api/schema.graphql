# =============================================================================
# RBAC: Role-Based Access Control via @aws_cognito_user_pools(cognito_groups: [...])
#
# Roles (Cognito Groups):
#   - Admin: Full access to all operations
#   - Author: Can create/modify configurations, upload documents, run tests
#   - Reviewer: Can review documents and perform HITL operations
#   - Viewer: Read-only access (default for authenticated users)
#
# Note: @aws_cognito_user_pools (no args) allows any authenticated user
#       @aws_cognito_user_pools(cognito_groups: [...]) restricts to specific groups
#
# IMPORTANT: Do NOT use @aws_auth(cognito_groups: [...]) on this API. This API
# has an additional authorization provider (AWS_IAM) configured, and on a
# multi-auth API AppSync silently ignores @aws_auth — every field decorated with
# it becomes reachable by ANY authenticated user regardless of group. Use
# @aws_cognito_user_pools(cognito_groups: [...]), which IS evaluated on
# multi-auth APIs. Group checks are also enforced defensively in the resolver
# Lambdas (defense-in-depth).
# =============================================================================
type Mutation {
  # Internal/IAM operations (Step Functions, Lambda)
  createDocument(input: CreateDocumentInput!): CreateDocumentOutput @aws_iam
  updateDocument(input: UpdateDocumentInput!): Document @aws_iam
  updateDocumentStatus(input: UpdateDocumentStatusInput!): Document @aws_iam
  updateDocumentSection(input: UpdateDocumentSectionInput!): Document @aws_iam
  updateAgentJobStatus(
    jobId: ID!
    status: String!
    userId: String!
    result: String
    error: String
  ): Boolean @aws_iam
  updateDiscoveryJobStatus(
    jobId: ID!
    status: String!
    errorMessage: String
    discoveredClassName: String
    statusMessage: String
    jobType: String
    currentStep: String
    totalDocuments: Int
    clustersFound: Int
    discoveredClasses: String
    reflectionReport: String
  ): DiscoveryJob @aws_iam
  updateConfigBootstrapJobStatus(
    jobId: ID!
    status: String!
    statusMessage: String
    errorMessage: String
    configVersion: String
    testSetId: String
  ): ConfigBootstrapJob @aws_iam
  updateFinetuningJobStatus(jobId: ID!, status: FinetuningJobStatus!, errorMessage: String): FinetuningJob @aws_iam

  # Admin-only operations
  deleteConfigVersion(versionName: String!): UpdateConfigurationResponse
    @aws_cognito_user_pools(cognito_groups: ["Admin"])
  createUser(email: String!, persona: String!, allowedConfigVersions: [String]): User
    @aws_cognito_user_pools(cognito_groups: ["Admin"])
  updateUser(userId: ID!, allowedConfigVersions: [String]): User
    @aws_cognito_user_pools(cognito_groups: ["Admin"])
  deleteUser(userId: ID!): Boolean
    @aws_cognito_user_pools(cognito_groups: ["Admin"])
  updatePricing(pricingConfig: AWSJSON!): UpdatePricingResponse
    @aws_cognito_user_pools(cognito_groups: ["Admin"])
  restoreDefaultPricing: UpdatePricingResponse
    @aws_cognito_user_pools(cognito_groups: ["Admin"])
  updateModelConfigLimits(modelConfigLimits: AWSJSON!): UpdateModelConfigLimitsResponse
    @aws_cognito_user_pools(cognito_groups: ["Admin"])
  restoreDefaultModelConfigLimits: UpdateModelConfigLimitsResponse
    @aws_cognito_user_pools(cognito_groups: ["Admin"])

  # Admin + Author operations
  deleteDocument(objectKeys: [String!]!): Boolean!
    @aws_cognito_user_pools(cognito_groups: ["Admin", "Author"])
  updateConfiguration(versionName: String!, customConfig: AWSJSON!, description: String): UpdateConfigurationResponse
    @aws_cognito_user_pools(cognito_groups: ["Admin", "Author"])
  setActiveVersion(versionName: String!): UpdateConfigurationResponse
    @aws_cognito_user_pools(cognito_groups: ["Admin", "Author"])
  syncBdaIdp(direction: String, versionName: String, bdaProjectArn: String, saveArn: Boolean, syncMode: String): SyncBdaIdpResponse
    @aws_cognito_user_pools(cognito_groups: ["Admin", "Author"])
  uploadDocument(
    fileName: String!
    contentType: String
    prefix: String
    bucket: String
    version: String
  ): PresignedUrlResponse!
    @aws_cognito_user_pools(cognito_groups: ["Admin", "Author"])
  uploadDiscoveryDocument(
    fileName: String!
    contentType: String
    prefix: String
    bucket: String
    groundTruthFileName: String
    version: String
    pageRanges: [String]
    pageLabels: [String]
    skipJobCreation: Boolean
    discoveryType: String
  ): DisPresignedUrlResponse!
    @aws_cognito_user_pools(cognito_groups: ["Admin", "Author"])
