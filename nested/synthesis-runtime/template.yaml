AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  AWS GenAI IDP Accelerator - Synthesis Runtime Nested Stack.
  Hosts the SEED document generator on an Amazon Bedrock AgentCore Runtime for
  cold-start config bootstrap and test-set synthesis. The generator is packaged
  as a linux/arm64 container serving the AgentCore HTTP service contract
  (/invocations + /ping on port 8080); a full Debian base is used because
  WeasyPrint's native libraries do not install reliably on the Lambda base, and
  AgentCore Runtime removes the Lambda 15-minute ceiling on generation runs.

Parameters:
  StackName:
    Type: String
    Description: Parent stack name
  TestSetBucketName:
    Type: String
    Description: Test Set S3 bucket name
  WorkingBucketName:
    Type: String
    Description: Working S3 bucket name (schema_dir staging)
  ConfigurationTableName:
    Type: String
    Description: Configuration DynamoDB table name
  CustomerManagedEncryptionKeyArn:
    Type: String
    Description: KMS key ARN for encryption
  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: Optional IAM permissions boundary ARN
  LogLevel:
    Type: String
    Default: "INFO"
  LogRetentionDays:
    Type: Number
    Default: 365
  BuildHash:
    Type: String
    Default: "initial"
    Description: Hash to trigger Docker image rebuild + runtime update when source changes
  ArtifactBucket:
    Type: String
    Description: S3 bucket containing build artifacts (source zip for CodeBuild)
  SourceZipfile:
    Type: String
    Description: S3 key for the source zip file used by CodeBuild
  AppSyncApiUrl:
    Type: String
    Description: AppSync GraphQL API URL for real-time status updates
    Default: ""
  AppSyncApiArn:
    Type: String
    Description: AppSync GraphQL API ARN for IAM permissions
    Default: ""

Conditions:
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]

Resources:
  ##########################################################################
  # ECR Repository
  ##########################################################################
  ECRRepository:
    Type: AWS::ECR::Repository
    # checkov:skip=CKV_AWS_51: "Mutable tags allowed for workflow flexibility"
    # checkov:skip=CKV_AWS_163: "ECR scanning optional per deployment requirements"
    Properties:
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey: !Ref CustomerManagedEncryptionKeyArn

  ##########################################################################
  # CodeBuild Project - builds the ARM64 Docker image and pushes to ECR
  ##########################################################################
  CodeBuildRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "Wildcard permissions required for CloudWatch Logs creation and ECR auth"
    Properties:
      Path: /
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub "codebuild.${AWS::URLSuffix}"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*"
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:BatchCheckLayerAvailability
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource: !GetAtt ECRRepository.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${ArtifactBucket}"
                  - !Sub "arn:${AWS::Partition}:s3:::${ArtifactBucket}/*"
              - Effect: Allow
                Action:
                  - kms:Encrypt
                  - kms:Decrypt
                  - kms:ReEncrypt*
                  - kms:GenerateDataKey*
                  - kms:DescribeKey
                Resource: !Ref CustomerManagedEncryptionKeyArn

  DockerBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Description: Build the ARM64 AgentCore Runtime image for the Synthesis Runtime
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        # ARM container build environment: AgentCore Runtime requires linux/arm64.
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/amazonlinux2-aarch64-standard:3.0
        Type: ARM_CONTAINER
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_ACCOUNT_ID
            Value: !Ref AWS::AccountId
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
          - Name: ECR_REPO_URI
            Value: !GetAtt ECRRepository.RepositoryUri
          - Name: IMAGE_TAG
            Value: latest
      Source:
        Type: S3
        Location: !Sub "${ArtifactBucket}/${SourceZipfile}"
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              commands:
                - echo Logging in to Amazon ECR...
                - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
            build:
              commands:
                - echo "Building Synthesis Runtime image (linux/arm64)..."
                - docker build --platform linux/arm64 -f nested/synthesis-runtime/Dockerfile -t $ECR_REPO_URI:$IMAGE_TAG .
            post_build:
              commands:
                - echo Pushing Docker image to ECR...
                - docker push $ECR_REPO_URI:$IMAGE_TAG
                - echo Build completed on `date`
      TimeoutInMinutes: 45
      EncryptionKey: !Ref CustomerManagedEncryptionKeyArn

  ##########################################################################
  # Custom Resource Lambda - triggers CodeBuild during deployment
  ##########################################################################
  DockerBuildRunFunctionRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "CloudWatch Logs require wildcard for log group creation"
    Properties:
      Path: /
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub "lambda.${AWS::URLSuffix}"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DockerBuildRunPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt DockerBuildProject.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"

  DockerBuildRunFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access"
          - id: W92
            reason: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not needed for custom resource Lambda"
    # checkov:skip=CKV_AWS_117: "No VPC needed"
    # checkov:skip=CKV_AWS_115: "No reserved concurrency needed"
    # checkov:skip=CKV_AWS_173: "No sensitive env vars"
    Properties:
      FunctionName: !Sub "GENAIIDP-${StackName}-SynthesisBuildRun"
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      Handler: index.handler
      Runtime: python3.12
      CodeUri: ./docker_build_lambda
      Description: Custom resource handler - triggers CodeBuild for the synthesis image
      MemorySize: 128
      Timeout: 900
      Role: !GetAtt DockerBuildRunFunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref DockerBuildRunFunctionLogGroup

  DockerBuildRunFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      RetentionInDays: !Ref LogRetentionDays

  DockerBuildRun:
    Type: Custom::DockerBuild
    DependsOn:
      - DockerBuildProject
      - ECRRepository
    Properties:
      ServiceToken: !GetAtt DockerBuildRunFunction.Arn
      ProjectName: !Ref DockerBuildProject
      BuildHash: !Ref BuildHash

  ##########################################################################
  # AgentCore Runtime execution role (assumed by the runtime to run the agent)
  ##########################################################################
  AgentCoreRuntimeExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "ECR auth token, X-Ray and CloudWatch metrics do not support resource-level permissions"
    Properties:
      Path: /
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub "bedrock-agentcore.${AWS::URLSuffix}"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*"
      Policies:
        - PolicyName: AgentCoreRuntimeExecutionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ECRImageAccess
                Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource: !GetAtt ECRRepository.Arn
              - Sid: ECRTokenAccess
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: RuntimeLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*"
              - Sid: RuntimeLogsDescribe
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"
              - Sid: XRay
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: "*"
              - Sid: CloudWatchMetrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: bedrock-agentcore
              - Sid: WorkloadIdentity
                Effect: Allow
                Action:
                  - bedrock-agentcore:GetWorkloadAccessToken
                  - bedrock-agentcore:GetWorkloadAccessTokenForJWT
                  - bedrock-agentcore:GetWorkloadAccessTokenForUserId
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default"
                  - !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/*"
              - Sid: BedrockModelInvocation
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:GetInferenceProfile
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:application-inference-profile/*"
              - Sid: GeneratorModelManagement
                Effect: Allow
                Action:
                  - bedrock-mantle:CreateInference
                  - bedrock-mantle:GetProject
                  - bedrock-mantle:ListProjects
                  - bedrock-mantle:ListTagsForResources
                Resource: "*"
              - Sid: TestSetBucketAccess
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:ListBucket, s3:DeleteObject]
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${TestSetBucketName}"
                  - !Sub "arn:${AWS::Partition}:s3:::${TestSetBucketName}/*"
              - Sid: WorkingBucketAccess
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:ListBucket]
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${WorkingBucketName}"
                  - !Sub "arn:${AWS::Partition}:s3:::${WorkingBucketName}/*"
              - Sid: ConfigTableRead
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:Scan]
                Resource:
                  - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConfigurationTableName}"
                  - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConfigurationTableName}/index/*"
              - Sid: KMSAccess
                Effect: Allow
                Action: [kms:Encrypt, kms:Decrypt, kms:ReEncrypt*, kms:GenerateDataKey*, kms:DescribeKey]
                Resource: !Ref CustomerManagedEncryptionKeyArn
              - Sid: AppSyncStatus
                Effect: Allow
                Action: appsync:GraphQL
                Resource: !Sub "${AppSyncApiArn}/*"

  ##########################################################################
  # AgentCore Runtime control-plane custom resource (create/update/delete)
  ##########################################################################
  AgentCoreRuntimeManagerRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "bedrock-agentcore list/create runtime APIs do not support resource-level permissions; CloudWatch Logs require wildcard"
    Properties:
      Path: /
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub "lambda.${AWS::URLSuffix}"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AgentCoreRuntimeManagerPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # CreateAgentRuntime transitively manages a DEFAULT endpoint, a
              # workload identity, and other agentcore sub-resources. This is a
              # deploy-time-only custom resource, so grant the full agentcore
              # action set (mirrors the AWS-managed BedrockAgentCoreFullAccess
              # policy, which is also bedrock-agentcore:*) rather than chasing
              # each transitively-required action one failed deploy at a time.
              - Effect: Allow
                Action: bedrock-agentcore:*
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt AgentCoreRuntimeExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: !Sub "bedrock-agentcore.${AWS::URLSuffix}"
              # CreateAgentRuntime provisions bedrock-agentcore service-linked
              # roles on first use — the runtime needs both the base and the
              # "network" (network.bedrock-agentcore) SLRs, and the set may grow
              # — so allow creating any bedrock-agentcore SLR (matched by the
              # service-principal suffix, which is the IAM safety boundary here).
              - Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*bedrock-agentcore.${AWS::URLSuffix}/*"
                Condition:
                  StringLike:
                    iam:AWSServiceName: !Sub "*bedrock-agentcore.${AWS::URLSuffix}"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"

  AgentCoreRuntimeManagerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Function does not require VPC access"
          - id: W92
            reason: "Function does not require reserved concurrency"
    # checkov:skip=CKV_AWS_116: "DLQ not needed for custom resource Lambda"
    # checkov:skip=CKV_AWS_117: "No VPC needed"
    # checkov:skip=CKV_AWS_115: "No reserved concurrency needed"
    # checkov:skip=CKV_AWS_173: "No sensitive env vars"
    Properties:
      FunctionName: !Sub "GENAIIDP-${StackName}-SynthesisRuntimeManager"
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      Handler: index.handler
      Runtime: python3.12
      CodeUri: ./agentcore_runtime_lambda
      Description: Custom resource handler - manages the AgentCore Runtime for synthesis
      MemorySize: 256
      Timeout: 900
      Role: !GetAtt AgentCoreRuntimeManagerRole.Arn
      LoggingConfig:
        LogGroup: !Ref AgentCoreRuntimeManagerFunctionLogGroup

  AgentCoreRuntimeManagerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !Ref CustomerManagedEncryptionKeyArn
      RetentionInDays: !Ref LogRetentionDays

  SynthesisAgentRuntime:
    Type: Custom::AgentCoreRuntime
    DependsOn:
      - DockerBuildRun
    Properties:
      ServiceToken: !GetAtt AgentCoreRuntimeManagerFunction.Arn
      # AgentCore Runtime names must match [a-zA-Z][a-zA-Z0-9_]{0,47} (no hyphens).
      AgentRuntimeName: !Sub
        - "idp_synthesis_${SafeName}"
        - SafeName: !Join ["_", !Split ["-", !Ref StackName]]
      ContainerUri: !Sub "${ECRRepository.RepositoryUri}:latest"
      ExecutionRoleArn: !GetAtt AgentCoreRuntimeExecutionRole.Arn
      BuildHash: !Ref BuildHash
      EnvironmentVariables:
        LOG_LEVEL: !Ref LogLevel
        TEST_SET_BUCKET: !Ref TestSetBucketName
        WORKING_BUCKET: !Ref WorkingBucketName
        CONFIGURATION_TABLE_NAME: !Ref ConfigurationTableName
        APPSYNC_API_URL: !Ref AppSyncApiUrl
        # The generator's Strands file_write/editor tools prompt for interactive
        # confirmation otherwise, which auto-cancels in the headless runtime.
        BYPASS_TOOL_CONSENT: "true"

Outputs:
  SynthesisRuntimeArn:
    Description: ARN of the Synthesis AgentCore Runtime
    Value: !GetAtt SynthesisAgentRuntime.AgentRuntimeArn
  ECRRepositoryUri:
    Description: URI of the ECR repository
    Value: !GetAtt ECRRepository.RepositoryUri
