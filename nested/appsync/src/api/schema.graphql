# =============================================================================
# RBAC: Role-Based Access Control via @aws_auth(cognito_groups: [...])
#
# Roles (Cognito Groups):
#   - Admin: Full access to all operations
#   - Author: Can create/modify configurations, upload documents, run tests
#   - Reviewer: Can review documents and perform HITL operations
#   - Viewer: Read-only access (default for authenticated users)
#
# Note: @aws_cognito_user_pools allows any authenticated user
#       @aws_auth(cognito_groups: [...]) restricts to specific groups
# =============================================================================
type Mutation {
  # Internal/IAM operations (Step Functions, Lambda)
  createDocument(input: CreateDocumentInput!): CreateDocumentOutput @aws_iam
  updateDocument(input: UpdateDocumentInput!): Document @aws_iam
  updateDocumentStatus(input: UpdateDocumentStatusInput!): Document @aws_iam
  updateDocumentSection(input: UpdateDocumentSectionInput!): Document @aws_iam
  updateAgentJobStatus(
    jobId: ID!
    status: String!
    userId: String!
    result: String
    error: String
  ): Boolean @aws_iam
  updateDiscoveryJobStatus(
    jobId: ID!
    status: String!
    errorMessage: String
    discoveredClassName: String
    statusMessage: String
    jobType: String
    currentStep: String
    totalDocuments: Int
    clustersFound: Int
    discoveredClasses: String
    reflectionReport: String
  ): DiscoveryJob @aws_iam
  updateFinetuningJobStatus(jobId: ID!, status: FinetuningJobStatus!, errorMessage: String): FinetuningJob @aws_iam

  # Admin-only operations
  deleteConfigVersion(versionName: String!): UpdateConfigurationResponse
    @aws_auth(cognito_groups: ["Admin"])
  createUser(email: String!, persona: String!, allowedConfigVersions: [String]): User
    @aws_auth(cognito_groups: ["Admin"])
  updateUser(userId: ID!, allowedConfigVersions: [String]): User
    @aws_auth(cognito_groups: ["Admin"])
  deleteUser(userId: ID!): Boolean
    @aws_auth(cognito_groups: ["Admin"])
  updatePricing(pricingConfig: AWSJSON!): UpdatePricingResponse
    @aws_auth(cognito_groups: ["Admin"])
  restoreDefaultPricing: UpdatePricingResponse
    @aws_auth(cognito_groups: ["Admin"])

  # Admin + Author operations
  deleteDocument(objectKeys: [String!]!): Boolean!
    @aws_auth(cognito_groups: ["Admin", "Author"])
  updateConfiguration(versionName: String!, customConfig: AWSJSON!, description: String): UpdateConfigurationResponse
    @aws_auth(cognito_groups: ["Admin", "Author"])
  setActiveVersion(versionName: String!): UpdateConfigurationResponse
    @aws_auth(cognito_groups: ["Admin", "Author"])
  syncBdaIdp(direction: String, versionName: String, bdaProjectArn: String, saveArn: Boolean, syncMode: String): SyncBdaIdpResponse
    @aws_auth(cognito_groups: ["Admin", "Author"])
  uploadDocument(
    fileName: String!
    contentType: String
    prefix: String
    bucket: String
    version: String
  ): PresignedUrlResponse!
    @aws_auth(cognito_groups: ["Admin", "Author"])
  uploadDiscoveryDocument(
    fileName: String!
    contentType: String
    prefix: String
    bucket: String
    groundTruthFileName: String
    version: String
    pageRanges: [String]
    pageLabels: [String]
    skipJobCreation: Boolean
    discoveryType: String
  ): DisPresignedUrlResponse!
    @aws_auth(cognito_groups: ["Admin", "Author"])
  autoDetectSections(
    documentKey: String!
    bucket: String!
    version: String
  ): String
    @aws_auth(cognito_groups: ["Admin", "Author"])
  startMultiDocDiscovery(
    s3Bucket: String
    s3Prefix: String
    configVersion: String!
    zipFileName: String
    zipFileSize: Int
  ): MultiDocDiscoveryJob
    @aws_auth(cognito_groups: ["Admin", "Author"])
  uploadMultiDocDiscoveryZip(
    fileName: String!
    fileSize: Int!
    configVersion: String!
  ): TestSetUploadResponse
    @aws_auth(cognito_groups: ["Admin", "Author"])
  copyToBaseline(objectKey: String!): CopyToBaselineResponse!
    @aws_auth(cognito_groups: ["Admin", "Author"])
  reprocessDocument(objectKeys: [String!]!, version: String): Boolean!
    @aws_auth(cognito_groups: ["Admin", "Author"])
  abortWorkflow(objectKeys: [String!]!): AbortWorkflowResponse!
    @aws_auth(cognito_groups: ["Admin", "Author"])
  deleteDiscoveryJob(jobId: ID!): Boolean!
    @aws_auth(cognito_groups: ["Admin", "Author"])
  startTestRun(input: TestRunInput!): TestRun
    @aws_auth(cognito_groups: ["Admin", "Author"])
  deleteTests(testRunIds: [String!]!): Boolean!
    @aws_auth(cognito_groups: ["Admin", "Author"])
  addTestSet(name: String!, description: String, filePattern: String!, bucketType: String!, fileCount: Int!, modifiedAfter: String): TestSet
    @aws_auth(cognito_groups: ["Admin", "Author"])
  addTestSetFromUpload(input: TestSetUploadInput!): TestSetUploadResponse
    @aws_auth(cognito_groups: ["Admin", "Author"])
  addDocumentsToTestSet(testSetId: String!, filePattern: String!, bucketType: String!, fileCount: Int!, modifiedAfter: String): TestSet
    @aws_auth(cognito_groups: ["Admin", "Author"])
  addDocumentsToTestSetFromUpload(input: TestSetDocumentsUploadInput!): TestSetUploadResponse
    @aws_auth(cognito_groups: ["Admin", "Author"])
  deleteTestSets(testSetIds: [String!]!): Boolean!
    @aws_auth(cognito_groups: ["Admin", "Author"])
  # Fine-Tuning (Admin + Author)
  createFinetuningJob(input: CreateFinetuningJobInput!): FinetuningJob
    @aws_auth(cognito_groups: ["Admin", "Author"])
  deleteFinetuningJob(jobId: ID!): Boolean
    @aws_auth(cognito_groups: ["Admin", "Author"])

  # Admin + Reviewer operations (HITL review workflow)
  processChanges(
    objectKey: String!
    modifiedSections: [ModifiedSectionInput!]!
    modifiedPages: [ModifiedPageInput!]
  ): ProcessChangesResponse!
    @aws_auth(cognito_groups: ["Admin", "Reviewer"])
  completeSectionReview(objectKey: String!, sectionId: String!, editedData: AWSJSON): Document
    @aws_auth(cognito_groups: ["Admin", "Reviewer"])
  skipAllSectionsReview(objectKey: String!): Document
    @aws_auth(cognito_groups: ["Admin", "Reviewer"])
  claimReview(objectKey: String!): Document
    @aws_auth(cognito_groups: ["Admin", "Reviewer"])
  releaseReview(objectKey: String!): Document
    @aws_auth(cognito_groups: ["Admin", "Reviewer"])

  # All authenticated users (creates state but read-like operations)
  deleteAgentJob(jobId: ID!): Boolean @aws_cognito_user_pools
  # Agent Chat operations (all authenticated Cognito users + IAM for backend)
  # Note: Reviewer exclusion from Agent Chat is enforced at the QUERY level —
  # all supporting queries (listChatSessions, getChatMessages, listAvailableAgents)
  # have @aws_auth directives excluding Reviewer. The mutations use @aws_cognito_user_pools
  # because @aws_auth + @aws_iam is not supported on the same field in AppSync.
  sendAgentChatMessage(
    prompt: String!
    sessionId: String
    method: String
    enableCodeIntelligence: Boolean
    toolMetadata: ToolMetadataInput
  ): AgentChatMessage @aws_cognito_user_pools @aws_iam
  updateAgentChatMessage(sessionId: ID!, content: String!): AgentChatMessage
    @aws_cognito_user_pools
    @aws_iam
  deleteChatSession(sessionId: ID!): Boolean @aws_cognito_user_pools @aws_iam
  updateChatSessionTitle(sessionId: ID!, title: String!): ChatSession
    @aws_cognito_user_pools
    @aws_iam

  # Circuit Breaker admin controls — Admin only.
  pauseCircuitBreaker(reason: String!): CircuitBreakerStatus
    @aws_auth(cognito_groups: ["Admin"])
  resumeCircuitBreaker(reason: String!): CircuitBreakerStatus
    @aws_auth(cognito_groups: ["Admin"])
  probeCircuitBreaker(reason: String!): CircuitBreakerStatus
    @aws_auth(cognito_groups: ["Admin"])
  # IAM-only fan-out trigger used by circuit_breaker_manager Lambda.
  # Return value is what subscribers receive; all successful calls to this
  # mutation broadcast to onCircuitBreakerStatusChange.
  publishCircuitBreakerStatus(status: AWSJSON!): CircuitBreakerStatus @aws_iam

  # === Feature Platform (optional) — mutations ===========================
  # Only wired up server-side when EnableFeaturePlatform=true. See the
  # matching note near type Query. Inlined here (rather than a separate
  # `extend type Mutation` block) because AppSync silently rejects schemas
  # that mix top-level + extend definitions in one SDL file and falls back
  # to the previously-deployed schema.
  #
  # Return types on the user-facing fields below are intentionally NULLABLE
  # (no trailing `!`). When EnableFeaturePlatform=false the resolvers are
  # not deployed; with non-nullable returns AppSync responds with the
  # confusing error "Cannot return null for non-nullable type ... within
  # parent 'Mutation' (/subscribeFeature)". Making the return nullable lets
  # the UI hooks (which already guard against null payloads) fail
  # gracefully instead of surfacing a GraphQL error to the admin.
  # The `registerFeature`/`unregisterFeature` mutations stay non-nullable
  # because they're @aws_iam and only invoked by feature stacks, which by
  # definition only exist when the feature platform is enabled.
  # -----------------------------------------------------------------------
  """Called by a feature stack's RegisterFeature custom resource once the stack has deployed."""
  registerFeature(input: RegisterFeatureInput!): InstalledFeature! @aws_iam

  """Called by a feature stack's RegisterFeature custom resource on stack delete."""
  unregisterFeature(featureId: String!): Boolean! @aws_iam

  """Admin-only: initiate a subscription for a feature. Returns a
  `FeatureEntitlement` whose `marketplaceUrl` is the AWS Marketplace (or
  simulator) URL the UI must redirect the admin to in order to accept
  pricing, EULA, and the AWS Customer Agreement. The entitlement `state`
  remains NONE until the admin completes the Marketplace flow; the UI
  should re-query `checkFeatureEntitlement` when the admin returns from
  the Marketplace tab. Optional `returnUrl` is threaded through so the
  Marketplace page can deep-link the admin back to the feature page.
  Returns null when EnableFeaturePlatform=false (no resolver attached)."""
  subscribeFeature(featureId: String!, returnUrl: String): FeatureEntitlement
    @aws_auth(cognito_groups: ["Admin"])

  """Admin-only: cancel a subscription for a feature by marking the simulator
  entitlement EXPIRED. With the real Marketplace, the UI should redirect the
  user to the AWS Marketplace Subscription Management portal instead of
  calling this. Returns the updated FeatureEntitlement, or null when
  EnableFeaturePlatform=false (no resolver attached)."""
  unsubscribeFeature(featureId: String!): FeatureEntitlement
    @aws_auth(cognito_groups: ["Admin"])
}

type DocumentPage @aws_cognito_user_pools @aws_iam {
  Documents: [Document]
  nextToken: String
}

type DocumentCount @aws_cognito_user_pools @aws_iam {
  count: Int!
}

# RBAC for Queries:
# Most queries are open to all authenticated users, with server-side filtering in Lambda resolvers
# (e.g., reviewer document filtering, config-version scoping). Feature-specific queries that should
# not be accessible to Reviewer role are restricted via @aws_auth directives at the field level.
# Document queries remain open to all roles (filtering is done server-side in resolvers).
type Query @aws_cognito_user_pools @aws_iam {
  # Document queries - all authenticated users (reviewer filtering done in resolver)
  getDocument(ObjectKey: ID!): Document
  listDocuments(
    startDateTime: AWSDateTime
    endDateTime: AWSDateTime
    limit: Int
    nextToken: String
  ): DocumentPage
  getDocumentCount(
    startDateTime: AWSDateTime
    endDateTime: AWSDateTime
  ): DocumentCount
  listDocumentsDateHour(date: AWSDate, hour: Int): DocumentList
  listDocumentsDateShard(date: AWSDate, shard: Int): DocumentList
  listDocumentsByDateRange(
    startDateTime: AWSDateTime!
    endDateTime: AWSDateTime!
    limit: Int
    nextToken: String
  ): DocumentPage
  getFileContents(s3Uri: String!): FileContentsResponse
  getStepFunctionExecution(executionArn: String!): StepFunctionExecutionResponse

  # Configuration & pricing queries - Admin, Author, Viewer (not Reviewer)
  getConfigVersions: ConfigurationVersionsResponse
    @aws_auth(cognito_groups: ["Admin", "Author", "Viewer"])
  getConfigVersion(versionName: String!): ConfigurationResponse
    @aws_auth(cognito_groups: ["Admin", "Author", "Viewer"])
  getPricing: PricingResponse
    @aws_auth(cognito_groups: ["Admin", "Author", "Viewer"])
  calculateCapacity(input: String!): CapacityResult
    @aws_auth(cognito_groups: ["Admin", "Author", "Viewer"])

  # Agent Chat & Code Explorer queries
  # Note: These need both Cognito and IAM auth (for return type resolution).
  # AppSync does not support @aws_auth(cognito_groups:[...]) + @aws_iam on the same field.
  # Reviewer exclusion is enforced by UI navigation (Agent Chat hidden for Reviewer)
  # and session scoping (users only see their own sessions).
  listAvailableAgents: [Agent] @aws_cognito_user_pools @aws_iam
  getAgentChatMessages(sessionId: ID!): [AgentChatMessage] @aws_cognito_user_pools @aws_iam
  listChatSessions(limit: Int, nextToken: String): ChatSessionConnection @aws_cognito_user_pools @aws_iam
  getChatMessages(sessionId: ID!): [AgentChatMessage] @aws_cognito_user_pools @aws_iam

  # Knowledge base & document chat queries
  queryKnowledgeBase(input: String!, sessionId: String): String
  chatWithDocument(
    s3Uri: String!
    prompt: String!
    history: AWSJSON!
    modelId: String!
  ): String

  # Discovery queries - Admin, Author only
  listDiscoveryJobs: DiscoveryJobList
    @aws_auth(cognito_groups: ["Admin", "Author"])

  # Agent query system - Admin, Author, Viewer (not Reviewer)
  submitAgentQuery(query: String!, agentIds: [String!]!): AgentJob
    @aws_auth(cognito_groups: ["Admin", "Author", "Viewer"])
  getAgentJobStatus(jobId: ID!): AgentJob
    @aws_auth(cognito_groups: ["Admin", "Author", "Viewer"])
  listAgentJobs(limit: Int, nextToken: String): AgentJobConnection
    @aws_auth(cognito_groups: ["Admin", "Author", "Viewer"])

  # Test Studio queries - Admin, Author only
  getTestRun(testRunId: String!): TestRun
    @aws_auth(cognito_groups: ["Admin", "Author"])
  getTestRuns(timePeriodHours: Int, startDateTime: AWSDateTime, endDateTime: AWSDateTime): [TestRun]
    @aws_auth(cognito_groups: ["Admin", "Author"])
  getTestRunStatus(testRunId: String!): TestRunStatus
    @aws_auth(cognito_groups: ["Admin", "Author"])
  compareTestRuns(testRunIds: [String!]!): TestRunComparison
    @aws_auth(cognito_groups: ["Admin", "Author"])
  getTestSets: [TestSet]
    @aws_auth(cognito_groups: ["Admin", "Author"])
  listBucketFiles(bucketType: String!, filePattern: String!, modifiedAfter: String): [String]
    @aws_auth(cognito_groups: ["Admin", "Author"])
  validateTestFileName(fileName: String!): TestSetValidationResponse
    @aws_auth(cognito_groups: ["Admin", "Author"])

  # Configuration Library queries - Admin, Author, Viewer (not Reviewer)
  listConfigurationLibrary(pattern: String!): ConfigurationLibraryResponse
    @aws_auth(cognito_groups: ["Admin", "Author", "Viewer"])
  getConfigurationLibraryFile(
    pattern: String!
    configName: String!
    fileName: String!
  ): ConfigurationLibraryFileResponse
    @aws_auth(cognito_groups: ["Admin", "Author", "Viewer"])

  # User Management queries
  listUsers: UserList @aws_cognito_user_pools
  getMyProfile: User @aws_cognito_user_pools

  # Fine-Tuning queries
  listFinetuningJobs(limit: Int, nextToken: String): FinetuningJobConnection @aws_cognito_user_pools
  getFinetuningJob(jobId: ID!): FinetuningJob @aws_cognito_user_pools
  validateTestSetForFinetuning(testSetId: ID!): TestSetValidationResult @aws_cognito_user_pools
  listAvailableModels: AvailableModelsResult @aws_cognito_user_pools

  # Circuit Breaker status — any authenticated user can read.
  getCircuitBreakerStatus: CircuitBreakerStatus

  # === Feature Platform (optional) — queries =============================
  # These fields are only wired up server-side when EnableFeaturePlatform=true
  # (resolvers live in the prototype/feature-platform/main-stack-extensions
  # nested stack). When the feature platform is off they are unresolved and
  # return null. The UI hides them behind the EnableFeaturePlatform flag.
  #
  # Return types are intentionally NULLABLE (no trailing `!`) so that with
  # EnableFeaturePlatform=false (no resolver attached) AppSync returns
  # `data: { ...: null }` instead of the confusing "Cannot return null for
  # non-nullable type ..." error. The UI hooks (`useCatalogFeatures`,
  # `useInstalledFeatures`, `useFeatureEntitlement`, `useFeatureLaunchUrl`)
  # all coerce null → empty list / sensible default.
  # -----------------------------------------------------------------------
  """List all features currently installed in this IDP stack.
  Returns null when EnableFeaturePlatform=false (no resolver attached)."""
  listInstalledFeatures: [InstalledFeature!] @aws_cognito_user_pools

  """List all features published to the seller bucket (the catalog), whether
  installed or not. The UI takes the union of this + listInstalledFeatures to
  show a "Subscribe" CTA for catalog-only features.
  Returns null when EnableFeaturePlatform=false (no resolver attached)."""
  listCatalogFeatures: [CatalogFeature!] @aws_cognito_user_pools

  """Check the subscription/entitlement state for a single feature for the caller.
  Returns null when EnableFeaturePlatform=false (no resolver attached)."""
  checkFeatureEntitlement(featureId: String!): FeatureEntitlement @aws_cognito_user_pools

  """Admin-only: get a CloudFormation Console quick-create URL for installing or updating a feature.
  Returns null when EnableFeaturePlatform=false (no resolver attached)."""
  getFeatureLaunchUrl(featureId: String!, version: String): FeatureLaunchUrl @aws_cognito_user_pools
}

type Subscription @aws_cognito_user_pools @aws_iam {
  onCreateDocument: CreateDocumentOutput
    @aws_subscribe(mutations: ["createDocument"])
  onUpdateDocument: Document @aws_subscribe(mutations: ["updateDocument", "updateDocumentStatus", "updateDocumentSection", "completeSectionReview", "skipAllSectionsReview", "claimReview", "releaseReview"])
  onAgentJobComplete(jobId: ID!): Boolean
    @aws_subscribe(mutations: ["updateAgentJobStatus"])
  onDiscoveryJobStatusChange(jobId: ID!): DiscoveryJob
    @aws_subscribe(mutations: ["updateDiscoveryJobStatus"])
  onAgentChatMessageUpdate(sessionId: String!): AgentChatMessage
    @aws_subscribe(mutations: ["sendAgentChatMessage"])
  onCircuitBreakerStatusChange: CircuitBreakerStatus
    @aws_subscribe(mutations: ["publishCircuitBreakerStatus"])
}

