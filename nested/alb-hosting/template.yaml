AWSTemplateFormatVersion: "2010-09-09"
Description: AWS GenAI IDP Accelerator - ALB hosting nested stack

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - E3002  # ALB ListenerRule "Transforms" property (host-header-rewrite) not yet in cfn-lint schema

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID for the ALB and S3 VPC endpoint

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnet IDs for the ALB (minimum 2 in different AZs)

  CertificateArn:
    Type: String
    Description: ACM certificate ARN for the ALB HTTPS listener

  ALBScheme:
    Type: String
    Default: internal
    AllowedValues: [internal, internet-facing]
    Description: ALB scheme

  ALBAllowedCIDRs:
    Type: String
    Default: ""
    Description: >-
      Comma-separated CIDR ranges for ALB security group ingress.
      Empty means use VPC CIDR.

  WebUIBucketName:
    Type: String
    Description: S3 bucket name for static web content

  StackName:
    Type: String
    Description: Parent stack name for resource naming

  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: Optional IAM permissions boundary ARN

  LoggingBucketName:
    Type: String
    Description: S3 bucket name for ALB access logs

  LambdaSecurityGroupId:
    Type: String
    Default: ""
    Description: >-
      Optional. The Lambda VPC security group used by app Lambdas. When set,
      this stack adds a 443 ingress rule on the S3 VPC Endpoint security group
      from the Lambda SG so that VPC-resident Lambdas (presigner resolvers,
      ConfigurationCopy custom resource, fcc dataset deployer, etc.) can
      reach S3 through this same VPC Endpoint instead of needing a separate
      VPCE. Required in private mode when DeployInVPC=true; leave empty if
      Lambdas don't run in the VPC.

Conditions:
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]
  HasLambdaSecurityGroup: !Not [!Equals [!Ref LambdaSecurityGroupId, ""]]

Resources:
  ##########################################################################
  # Security Group Ingress Manager (handles single or multiple CIDRs)
  ##########################################################################

  SGIngressManagerRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM5
            reason: "ec2:DescribeVpcs and ec2:DescribeSecurityGroupRules do not support resource-level permissions and require Resource: '*'"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub "lambda.${AWS::URLSuffix}"
            Action: sts:AssumeRole
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      Policies:
        - PolicyName: SGIngressManager
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeVpcs
                  - ec2:DescribeSecurityGroupRules
                Resource: "*"
              - Effect: Allow
                Action:
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"

  SGIngressManagerFunction:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Custom resource Lambda does not need VPC access"
          - id: W92
            reason: "Custom resource Lambda does not need reserved concurrency"
          - id: AwsSolutions-L1
            reason: "Runtime version is managed project-wide; will be updated holistically across all Lambda functions"
    # checkov:skip=CKV_AWS_116: "DLQ not required for CloudFormation custom resource"
    # checkov:skip=CKV_AWS_117: "Function does not need VPC access"
    # checkov:skip=CKV_AWS_115: "Function does not need reserved concurrency"
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      MemorySize: 128
      Role: !GetAtt SGIngressManagerRole.Arn
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          ec2 = boto3.client("ec2")

          def get_cidrs(props):
              """Resolve CIDR list: use provided CIDRs or look up VPC CIDR."""
              cidr_str = props.get("AllowedCIDRs", "")
              if cidr_str:
                  return [c.strip() for c in cidr_str.split(",") if c.strip()]
              # Fall back to VPC CIDR
              vpc_id = props["VpcId"]
              resp = ec2.describe_vpcs(VpcIds=[vpc_id])
              return [resp["Vpcs"][0]["CidrBlock"]]

          def get_existing_cidrs(sg_id):
              """Get CIDRs from existing ingress rules tagged by this custom resource."""
              resp = ec2.describe_security_group_rules(
                  Filters=[{"Name": "group-id", "Values": [sg_id]}]
              )
              return [
                  r["CidrIpv4"] for r in resp["SecurityGroupRules"]
                  if not r["IsEgress"] and r.get("CidrIpv4")
                  and r.get("FromPort") == 443 and r.get("ToPort") == 443
              ]

          def add_cidrs(sg_id, cidrs):
              for cidr in cidrs:
                  try:
                      ec2.authorize_security_group_ingress(
                          GroupId=sg_id,
                          IpPermissions=[{
                              "IpProtocol": "tcp", "FromPort": 443, "ToPort": 443,
                              "IpRanges": [{"CidrIp": cidr, "Description": "ALB ingress"}]
                          }]
                      )
                  except ec2.exceptions.ClientError as e:
                      if "Duplicate" not in str(e):
                          raise

          def remove_cidrs(sg_id, cidrs):
              for cidr in cidrs:
                  try:
                      ec2.revoke_security_group_ingress(
                          GroupId=sg_id,
                          IpPermissions=[{
                              "IpProtocol": "tcp", "FromPort": 443, "ToPort": 443,
                              "IpRanges": [{"CidrIp": cidr}]
                          }]
                      )
                  except Exception:
                      pass  # Best effort on removal

          def handler(event, context):
              try:
                  props = event["ResourceProperties"]
                  sg_id = props["SecurityGroupId"]

                  if event["RequestType"] == "Delete":
                      existing = get_existing_cidrs(sg_id)
                      remove_cidrs(sg_id, existing)
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return

                  cidrs = get_cidrs(props)

                  if event["RequestType"] == "Update":
                      # Remove old rules, add new ones
                      existing = get_existing_cidrs(sg_id)
                      to_remove = set(existing) - set(cidrs)
                      to_add = set(cidrs) - set(existing)
                      remove_cidrs(sg_id, to_remove)
                      add_cidrs(sg_id, to_add)
                  else:
                      # Create
                      add_cidrs(sg_id, cidrs)

                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                      "CIDRs": ",".join(cidrs),
                      "RuleCount": str(len(cidrs)),
                  })
              except Exception as e:
                  cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": str(e)})

  ##########################################################################
  # Security Groups
  ##########################################################################

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: "Egress restricted to VPC endpoint security group on port 443"
          - id: W9
            reason: "Ingress rules managed by SGIngressManager custom resource"
    Properties:
      GroupDescription: !Sub "${StackName} ALB Security Group"
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub "${StackName}-alb-sg"

  SGIngressManagerCustomResource:
    Type: Custom::SGIngressManager
    Properties:
      ServiceToken: !GetAtt SGIngressManagerFunction.Arn
      SecurityGroupId: !Ref ALBSecurityGroup
      VpcId: !Ref VpcId
      AllowedCIDRs: !Ref ALBAllowedCIDRs

  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${StackName} S3 VPC Endpoint Security Group"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: "Allow HTTPS from ALB security group"
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          DestinationSecurityGroupId: !Ref ALBSecurityGroup
          Description: "Allow HTTPS responses back to ALB security group"
      Tags:
        - Key: Name
          Value: !Sub "${StackName}-s3-endpoint-sg"

  ALBToEndpointEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref ALBSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref EndpointSecurityGroup
      Description: "Allow HTTPS to S3 VPC endpoint security group"

  # In private mode, app Lambdas reach S3 through this same VPCE (presigner
  # resolvers issue presigned URLs whose host is the VPCE bucket-vhost; the
  # ConfigurationCopy / fcc-dataset-deployer custom resources also use the
  # VPCE as their boto3 endpoint_url). Open 443 from the Lambda SG to the
  # endpoint SG so those calls don't connect-timeout.
  LambdaToEndpointIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasLambdaSecurityGroup
    Properties:
      GroupId: !Ref EndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref LambdaSecurityGroupId
      Description: "Allow HTTPS from app Lambda security group"

  LambdaToEndpointEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: HasLambdaSecurityGroup
    Properties:
      GroupId: !Ref LambdaSecurityGroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref EndpointSecurityGroup
      Description: "Allow HTTPS to S3 VPC endpoint security group"

  ##########################################################################
  # S3 Interface VPC Endpoint
  ##########################################################################

  S3InterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W76
            reason: >-
              Wildcard Resource (arn:*:s3:::*) is required because the parent stack
              creates all application buckets after this nested stack — enumerating
              them would create a cyclic dependency. Access is scoped by: (1) finite
              action list, (2) aws:PrincipalAccount + aws:ResourceAccount conditions
              restricting to same-account only, (3) endpoint security group limiting
              traffic to ALB/Lambda SGs, (4) IAM execution-role policies, (5) bucket
              policies on each application bucket.
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcId: !Ref VpcId
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup
      PrivateDnsEnabled: false
      # Scoped endpoint policy: restricts S3 actions to only what's needed.
      # The ALB serves static WebUI content (unsigned requests) and Lambda
      # functions generate presigned URLs for browser uploads (signed).
      #
      # Why we don't enumerate all app buckets: the IDP parent stack creates
      # the bucket resources (Input, Output, Working, Configuration, etc.)
      # AFTER it creates this nested stack — passing the names down would
      # create a cyclic CloudFormation dependency. Bucket-level access is
      # still enforced at three other layers:
      #   1. Endpoint security group (only ALB SG + Lambda SG → 443)
      #   2. Lambda execution-role IAM policies (least-privilege per function)
      #   3. S3 bucket policies (restrict access to authorized principals)
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowWebUIBucketRead
            Effect: Allow
            Principal: "*"
            Action:
              - "s3:GetObject"
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::${WebUIBucketName}/*"
          - Sid: AllowWebUIBucketList
            Effect: Allow
            Principal: "*"
            Action:
              - "s3:ListBucket"
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::${WebUIBucketName}"
          - Sid: AllowSameAccountS3Operations
            Effect: Allow
            Principal: "*"
            Action:
              - "s3:GetObject"
              - "s3:PutObject"
              - "s3:AbortMultipartUpload"
              - "s3:ListBucket"
              - "s3:GetBucketLocation"
              - "s3:ListMultipartUploadParts"
              - "s3:DeleteObject"
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::*"
            Condition:
              StringEquals:
                aws:PrincipalAccount: !Ref AWS::AccountId
                aws:ResourceAccount: !Ref AWS::AccountId

  ##########################################################################
  # ALB Target Group & Target Registration
  ##########################################################################

  S3TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${StackName}-s3-tg"
      TargetType: ip
      Protocol: HTTPS
      Port: 443
      VpcId: !Ref VpcId
      HealthCheckProtocol: HTTPS
      HealthCheckPort: "443"
      HealthCheckPath: /
      Matcher:
        HttpCode: "200,307,405"
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 3
      UnhealthyThresholdCount: 3
      Tags:
        - Key: Name
          Value: !Sub "${StackName}-s3-target-group"

  RegisterTargetsRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM5
            reason: "ec2:DescribeVpcEndpoints and ec2:DescribeNetworkInterfaces do not support resource-level permissions and require Resource: '*'"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub "lambda.${AWS::URLSuffix}"
            Action: sts:AssumeRole
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      Policies:
        - PolicyName: RegisterTargets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeVpcEndpoints
                  - ec2:DescribeNetworkInterfaces
                Resource: "*"
              - Effect: Allow
                Action:
                  - elasticloadbalancing:RegisterTargets
                  - elasticloadbalancing:DeregisterTargets
                Resource: !Sub "arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:targetgroup/*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"

  RegisterTargetsFunction:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Custom resource Lambda does not need VPC access"
          - id: W92
            reason: "Custom resource Lambda does not need reserved concurrency"
          - id: AwsSolutions-L1
            reason: "Runtime version is managed project-wide; will be updated holistically across all Lambda functions"
    # checkov:skip=CKV_AWS_116: "DLQ not required for CloudFormation custom resource"
    # checkov:skip=CKV_AWS_117: "Function does not need VPC access"
    # checkov:skip=CKV_AWS_115: "Function does not need reserved concurrency"
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      MemorySize: 128
      Role: !GetAtt RegisterTargetsRole.Arn
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          def handler(event, context):
              try:
                  ec2 = boto3.client("ec2")
                  elbv2 = boto3.client("elbv2")
                  vpce_id = event["ResourceProperties"]["VpcEndpointId"]
                  tg_arn = event["ResourceProperties"]["TargetGroupArn"]

                  # Get VPC endpoint ENI IDs
                  vpce_resp = ec2.describe_vpc_endpoints(VpcEndpointIds=[vpce_id])
                  eni_ids = vpce_resp["VpcEndpoints"][0]["NetworkInterfaceIds"]

                  # Get private IPs from ENIs
                  eni_resp = ec2.describe_network_interfaces(NetworkInterfaceIds=eni_ids)
                  ips = [eni["PrivateIpAddress"] for eni in eni_resp["NetworkInterfaces"]]

                  if event["RequestType"] == "Delete":
                      targets = [{"Id": ip, "Port": 443} for ip in ips]
                      try:
                          elbv2.deregister_targets(TargetGroupArn=tg_arn, Targets=targets)
                      except Exception:
                          pass  # Best effort on delete
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return

                  if event["RequestType"] == "Update":
                      # Deregister old targets from previous endpoint (if changed)
                      old_vpce_id = event.get("OldResourceProperties", {}).get("VpcEndpointId", "")
                      if old_vpce_id and old_vpce_id != vpce_id:
                          try:
                              old_resp = ec2.describe_vpc_endpoints(VpcEndpointIds=[old_vpce_id])
                              old_eni_ids = old_resp["VpcEndpoints"][0]["NetworkInterfaceIds"]
                              old_eni_resp = ec2.describe_network_interfaces(NetworkInterfaceIds=old_eni_ids)
                              old_ips = [eni["PrivateIpAddress"] for eni in old_eni_resp["NetworkInterfaces"]]
                              old_targets = [{"Id": ip, "Port": 443} for ip in old_ips]
                              elbv2.deregister_targets(TargetGroupArn=tg_arn, Targets=old_targets)
                          except Exception:
                              pass  # Old endpoint may no longer exist

                  # Register current targets (Create or Update)
                  targets = [{"Id": ip, "Port": 443} for ip in ips]
                  elbv2.register_targets(TargetGroupArn=tg_arn, Targets=targets)

                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                      "IpAddresses": ",".join(ips),
                      "TargetCount": str(len(ips)),
                  })
              except Exception as e:
                  cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": str(e)})

  RegisterTargetsCustomResource:
    Type: Custom::RegisterTargets
    Properties:
      ServiceToken: !GetAtt RegisterTargetsFunction.Arn
      VpcEndpointId: !Ref S3InterfaceEndpoint
      TargetGroupArn: !Ref S3TargetGroup
      # UpdateToken changes when the VPC endpoint is replaced, forcing
      # the custom resource to re-register targets with new ENI IPs
      UpdateToken: !Sub "${S3InterfaceEndpoint}"

  ##########################################################################
  # Application Load Balancer
  ##########################################################################

  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W52
            reason: "ALB access logging is configured to the logging bucket"
      cdk_nag:
        rules_to_suppress:
          - id: NIST.800.53.R4-ALBWAFEnabled
            reason: "ALB hosting is for GovCloud/private networks with IP-based access control via ALBAllowedCIDRs and security groups"
          - id: NIST.800.53.R5-ALBWAFEnabled
            reason: "ALB hosting is for GovCloud/private networks with IP-based access control via ALBAllowedCIDRs and security groups"
    Properties:
      Name: !Sub "${StackName}-webui-alb"
      Type: application
      Scheme: !Ref ALBScheme
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !Ref ALBSecurityGroup
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "60"
        - Key: routing.http2.enabled
          Value: "true"
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        - Key: access_logs.s3.enabled
          Value: "true"
        - Key: access_logs.s3.bucket
          Value: !Ref LoggingBucketName
        - Key: access_logs.s3.prefix
          Value: alb-access-logs
      Tags:
        - Key: Name
          Value: !Sub "${StackName}-webui-alb"

  ##########################################################################
  # ALB Listener and Rules
  ##########################################################################

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "404"
            ContentType: text/plain
            MessageBody: "Not Found"

  # Rule 1: Root path - rewrite to /index.html for SPA entry point
  ALBListenerRuleRoot:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    DependsOn: RegisterTargetsCustomResource
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - "/"
      Actions:
        - Type: forward
          TargetGroupArn: !Ref S3TargetGroup
      Transforms:
        - Type: host-header-rewrite
          HostHeaderRewriteConfig:
            Rewrites:
              - Regex: ".*"
                Replace: !Sub "${WebUIBucketName}.s3.${AWS::Region}.${AWS::URLSuffix}"
        - Type: url-rewrite
          UrlRewriteConfig:
            Rewrites:
              # The url-rewrite regex matches against path + query string.
              # Matching only the leading "/" leaves the query string intact,
              # which is required for OAuth callbacks ("/?code=...&state=...").
              # "^/$" does not match when a query string is present, causing
              # S3 to see a bare "GET /" (ListBucket) and return AccessDenied.
              - Regex: "^/"
                Replace: "/index.html"

  # Rule 2: All other paths - serve static assets (JS, CSS, images, fonts, etc.)
  ALBListenerRuleCatchAll:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    DependsOn: RegisterTargetsCustomResource
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 2
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - "/*"
      Actions:
        - Type: forward
          TargetGroupArn: !Ref S3TargetGroup
      Transforms:
        - Type: host-header-rewrite
          HostHeaderRewriteConfig:
            Rewrites:
              - Regex: ".*"
                Replace: !Sub "${WebUIBucketName}.s3.${AWS::Region}.${AWS::URLSuffix}"

Outputs:
  WebUIURL:
    Description: Web UI URL via ALB
    Value: !Sub "https://${ALB.DNSName}"

  ALBDNSName:
    Description: ALB DNS name
    Value: !GetAtt ALB.DNSName

  ALBArn:
    Description: ALB ARN
    Value: !Ref ALB

  S3VPCEndpointId:
    Description: S3 VPC Interface Endpoint ID
    Value: !Ref S3InterfaceEndpoint

  S3VPCEndpointDnsName:
    Description: >-
      Regional DNS name of the S3 Interface VPC Endpoint, with the AWS-assigned
      random suffix and the leading "*." stripped. Use this (not just the
      endpoint id) to build presigned URL hosts in the form
      "bucket.<this-value>" so that DNS resolution succeeds for browser uploads.
    # DnsEntries format: ["Z1234:*.bucket.vpce-0abc123.s3.us-east-1.vpce.amazonaws.com", ...]
    # Step 1: Select first entry → "Z1234:*.bucket.vpce-0abc123.s3.us-east-1.vpce.amazonaws.com"
    # Step 2: Split on ":" and take index 1 → "*.bucket.vpce-0abc123.s3.us-east-1.vpce.amazonaws.com"
    # Step 3: Split on "*." and take index 1 → "bucket.vpce-0abc123.s3.us-east-1.vpce.amazonaws.com"
    # Result is used as: <bucket-name>.<this-value> for presigned URL endpoint_url
    Value: !Select
      - 1
      - !Split
        - "*."
        - !Select
          - 1
          - !Split
            - ":"
            - !Select [0, !GetAtt S3InterfaceEndpoint.DnsEntries]

  ALBHostedZoneID:
    Description: ALB Canonical Hosted Zone ID (for Route53 alias records)
    Value: !GetAtt ALB.CanonicalHostedZoneID
