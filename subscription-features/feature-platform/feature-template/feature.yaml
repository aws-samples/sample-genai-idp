# Copy this template to a new directory and customise.
# Schema: `idp-feature-cli show-schema`

featureId: my-feature           # DNS-safe slug; also used as S3 prefix & session-tag value
displayName: My Feature          # Human-readable — shown in nav & feature page
version: 0.1.0                  # SemVer
description: |
  One-paragraph description shown on the Marketplace listing and in the UI.

template:
  path: template.yaml           # CloudFormation template for the feature stack
  requiresMainStackName: true   # Required: the template declares a MainStackName parameter

ui:
  bundlePath: feature-ui/dist/ui-bundle.js   # Output of the UI build
  buildCommand: "cd feature-ui && npm ci && npm run build"

# marketplace:                  # Uncomment and fill in once you have a Marketplace listing
#   productCode: <your AWS Marketplace product code>
#   listingUrl: https://aws.amazon.com/marketplace/pp/prodview-XYZ

defaultParameters:
  LogLevel: INFO

capabilities:
  - custom-api       # remove if this is a client-only feature
