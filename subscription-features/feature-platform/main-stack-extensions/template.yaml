AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Feature Platform extensions — nested stack deployed from the main IDP stack
  when EnableFeaturePlatform=true. Adds the InstalledFeatures table, 4 AppSync
  resolvers + Lambdas, and the prefix-scoped bucket policy that lets feature
  stacks write their UI bundles under features/<id>/* in the main WebUIBucket.

  Nothing here is destructive: the template is purely additive. It references
  the main stack's existing GraphQLApi, WebUIBucket, UserPool, UsersTable via
  parameters — the main stack passes !Ref / !GetAtt values through.

Parameters:

  MainStackName:
    Type: String
    Description: Name of the parent IDP stack. Stamped into CloudFormation
      Console quick-create URLs for feature stacks so they can look up the
      main stack's Exports.

  GraphQLApiId:
    Type: String
    Description: AppSync API id of the main stack's GraphQL API.

  GraphQLApiArn:
    Type: String
    Description: AppSync API ARN of the main stack's GraphQL API.

  AppSyncApiUrl:
    Type: String
    Description: AppSync API URL (https://xxx.appsync-api.<region>.amazonaws.com/graphql).

  UserPoolId:
    Type: String
    Description: Cognito User Pool id of the main stack.

  UserPoolClientId:
    Type: String
    Description: Cognito User Pool Client id of the main stack. Feature stacks
      use this as the JWT audience when verifying tokens issued by the User
      Pool (HTTP API JwtConfiguration.audience).

  TrackingTableName:
    Type: String
    Description: DynamoDB TrackingTable name from the main stack. Feature
      stacks that need to read document state (e.g. docs-by-status) grant
      themselves `dynamodb:Scan`/`Query` on this table name. Re-exported as
      `${MainStackName}-TrackingTableName` for Fn::ImportValue usage by
      feature stacks.

  CustomerManagedEncryptionKeyArn:
    Type: String
    Default: ''
    Description: ARN of the main stack's customer-managed KMS key used to
      encrypt the TrackingTable (and other main-stack DynamoDB tables).
      Re-exported as `${MainStackName}-CustomerManagedEncryptionKeyArn` so
      feature stacks that query encrypted main-stack tables can grant
      themselves `kms:Decrypt` on the correct key. Leave blank if the main
      stack uses AWS-managed encryption only — feature stacks will just
      skip the grant.

  WebUIBucketName:

    Type: String
    Description: S3 bucket serving the web UI. Feature stacks will write their
      UMD UI bundles under features/<featureId>/* inside this bucket.

  WebUIBucketArn:
    Type: String
    Description: ARN of the WebUIBucket.

  SellerBucketName:
    Type: String
    Default: ''
    Description: S3 bucket the publisher pushes feature bundles to (templates,
      UI bundles, latest.json). May live in another account; feature stacks
      read from it over HTTPS. Leave blank to disable "Update available" checks.

  SellerBucketRegion:
    Type: String
    Default: 'us-east-1'
    Description: Region of the seller bucket.

  SimulatorEntitlementEndpoint:
    Type: String
    Default: ''
    Description: Override for the marketplace-entitlement endpoint (e.g.
      https://mp-sim.example.com). Leave blank to use the real AWS Marketplace
      endpoint. Also used by subscribeFeature / unsubscribeFeature resolvers
      (they POST to `<endpoint>/admin/entitlements[/expire]`).

  DefaultCustomerIdentifier:
    Type: String
    Default: ''
    Description: Fallback CustomerIdentifier used when no
      X-Amzn-Marketplace-Customer-Identifier header is present. Useful in
      dev/simulator setups where the main stack wasn't launched through
      Marketplace.

  FeatureProductCodeMap:
    Type: String
    Default: '{}'
    Description: JSON map from featureId to Marketplace product code. e.g.
      {"docs-by-status":"abcdef123"}. Callers of checkFeatureEntitlement get
      NONE for any featureId not listed here.

  FeatureOfferIdMap:
    Type: String
    Default: '{}'
    Description: JSON map from featureId to Marketplace offerId used by the
      subscribeFeature redirect. In simulator mode the simulator auto-creates
      a default public offer when this is empty. In production (real AWS
      Marketplace) a pre-existing offerId must be provided per feature.

  FeatureMarketplaceUrlMap:
    Type: String
    Default: '{}'
    Description: JSON map from featureId to the AWS Marketplace product-page
      URL the UI should redirect the admin to when they click "Subscribe".
      Required in production (SIMULATOR_SOURCE_TAG=marketplace); ignored in
      simulator mode where the URL is built from SimulatorEntitlementEndpoint.

  DefaultBuyerAccountId:
    Type: String
    Default: '111122223333'
    Description: 12-digit simulator buyer account id used as the default
      subscriber in the Marketplace Simulation flow. Ignored in real AWS
      Marketplace mode (the buyer is resolved from AWS account context).

  AdminGroupName:
    Type: String
    Default: 'Admin'
    Description: Cognito group that getFeatureLaunchUrl requires.

  LogLevel:
    Type: String
    Default: 'INFO'
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]

Conditions:

  HasSellerBucket: !Not [!Equals [!Ref SellerBucketName, '']]
  HasSimulatorEndpoint: !Not [!Equals [!Ref SimulatorEntitlementEndpoint, '']]

Globals:

  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Tracing: Active
    Architectures: [arm64]

Resources:

  ###########################################################################
  # DynamoDB — one row per installed feature
  ###########################################################################
  InstalledFeaturesTable:
    Type: AWS::DynamoDB::Table
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: featureId
          AttributeType: S
      KeySchema:
        - AttributeName: featureId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  ###########################################################################
  # IAM role used by ALL 4 feature-platform Lambdas
  # (smaller blast radius than inheriting the main-stack Lambda role)
  ###########################################################################
  FeaturePlatformLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: InstalledFeaturesTableAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                Resource: !GetAtt InstalledFeaturesTable.Arn
        - !If
          - HasSellerBucket
          - PolicyName: SellerBucketRead
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                # GetObject on feature artifacts (latest.json, manifest.json,
                # template.yaml, ui-bundle.js). Used by list_installed_features,
                # list_catalog_features, get_feature_launch_url.
                - Effect: Allow
                  Action: s3:GetObject
                  Resource: !Sub 'arn:${AWS::Partition}:s3:::${SellerBucketName}/features/*'
                # ListBucket (scoped to features/*) so list_catalog_features can
                # enumerate published featureIds via CommonPrefixes.
                - Effect: Allow
                  Action: s3:ListBucket
                  Resource: !Sub 'arn:${AWS::Partition}:s3:::${SellerBucketName}'
                  Condition:
                    StringLike:
                      s3:prefix:
                        - 'features/'
                        - 'features/*'
          - !Ref AWS::NoValue
        - PolicyName: MarketplaceEntitlement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - aws-marketplace:GetEntitlements
                Resource: '*'
        # `getFeatureLaunchUrl` calls cloudformation:DescribeStacks to resolve
        # an existing feature stack's ARN. The ARN is then embedded in a
        # CloudFormation Console "update stack" URL, which avoids the
        # AlreadyExistsException users hit when re-running quickcreate against
        # a feature that is already installed. Scoped to feature stacks
        # launched under this main stack's namespace
        # (`<MainStackName>-feature-*`).
        - PolicyName: DescribeFeatureStacks
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${MainStackName}-feature-*/*'

  ###########################################################################
  # 4 Lambdas
  ###########################################################################
  ListInstalledFeaturesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./lambdas/list_installed_features/
      Handler: index.handler
      Role: !GetAtt FeaturePlatformLambdaRole.Arn
      Environment:
        Variables:
          INSTALLED_FEATURES_TABLE: !Ref InstalledFeaturesTable
          SELLER_BUCKET: !Ref SellerBucketName
          SELLER_BUCKET_REGION: !Ref SellerBucketRegion
          LOG_LEVEL: !Ref LogLevel

  # Lists the feature catalog (what is *published* to the seller bucket), so
  # the nav can show entries for features that are subscribe-able but not yet
  # installed. Reads s3://<SellerBucket>/features/<id>/latest.json etc. Runs
  # with the shared FeaturePlatformLambdaRole which already has SellerBucket
  # GetObject; list_catalog_features additionally needs ListBucket — granted
  # in the FeaturePlatformLambdaRole SellerBucketRead policy below.
  ListCatalogFeaturesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./lambdas/list_catalog_features/
      Handler: index.handler
      Role: !GetAtt FeaturePlatformLambdaRole.Arn
      Environment:
        Variables:
          SELLER_BUCKET: !Ref SellerBucketName
          SELLER_BUCKET_REGION: !Ref SellerBucketRegion
          LOG_LEVEL: !Ref LogLevel

  RegisterFeatureFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./lambdas/register_feature/
      Handler: index.handler
      Role: !GetAtt FeaturePlatformLambdaRole.Arn
      Environment:
        Variables:
          INSTALLED_FEATURES_TABLE: !Ref InstalledFeaturesTable
          LOG_LEVEL: !Ref LogLevel

  GetFeatureLaunchUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./lambdas/get_feature_launch_url/
      Handler: index.handler
      Role: !GetAtt FeaturePlatformLambdaRole.Arn
      Environment:
        Variables:
          INSTALLED_FEATURES_TABLE: !Ref InstalledFeaturesTable
          SELLER_BUCKET: !Ref SellerBucketName
          SELLER_BUCKET_REGION: !Ref SellerBucketRegion
          MAIN_STACK_NAME: !Ref MainStackName
          ADMIN_GROUP: !Ref AdminGroupName
          LOG_LEVEL: !Ref LogLevel

  CheckFeatureEntitlementFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./lambdas/check_feature_entitlement/
      Handler: index.handler
      Role: !GetAtt FeaturePlatformLambdaRole.Arn
      Environment:
        Variables:
          FEATURE_PRODUCT_CODE_MAP: !Ref FeatureProductCodeMap
          DEFAULT_CUSTOMER_IDENTIFIER: !Ref DefaultCustomerIdentifier
          SIMULATOR_SOURCE_TAG: !If [HasSimulatorEndpoint, 'simulator', 'marketplace']
          AWS_ENDPOINT_URL_MARKETPLACE_ENTITLEMENT_SERVICE: !Ref SimulatorEntitlementEndpoint
          LOG_LEVEL: !Ref LogLevel

  # Admin-only Mutation resolvers that POST to the simulator's admin API to
  # flip an entitlement on/off. Real-Marketplace deployments (no simulator
  # endpoint) will get a SubscribeError at runtime — in that case the UI is
  # expected to redirect to the Marketplace Subscription Management portal
  # rather than invoking these mutations. Kept behind the same admin group
  # check as getFeatureLaunchUrl.
  SubscribeFeatureFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./lambdas/subscribe_feature/
      Handler: index.handler
      Role: !GetAtt FeaturePlatformLambdaRole.Arn
      Environment:
        Variables:
          SIMULATOR_ADMIN_ENDPOINT: !Ref SimulatorEntitlementEndpoint
          FEATURE_PRODUCT_CODE_MAP: !Ref FeatureProductCodeMap
          FEATURE_OFFER_ID_MAP: !Ref FeatureOfferIdMap
          FEATURE_MARKETPLACE_URL_MAP: !Ref FeatureMarketplaceUrlMap
          DEFAULT_CUSTOMER_IDENTIFIER: !Ref DefaultCustomerIdentifier
          DEFAULT_BUYER_ACCOUNT_ID: !Ref DefaultBuyerAccountId
          ADMIN_GROUP: !Ref AdminGroupName
          SIMULATOR_SOURCE_TAG: !If [HasSimulatorEndpoint, 'simulator', 'marketplace']
          LOG_LEVEL: !Ref LogLevel

  UnsubscribeFeatureFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./lambdas/unsubscribe_feature/
      Handler: index.handler
      Role: !GetAtt FeaturePlatformLambdaRole.Arn
      Environment:
        Variables:
          SIMULATOR_ADMIN_ENDPOINT: !Ref SimulatorEntitlementEndpoint
          FEATURE_PRODUCT_CODE_MAP: !Ref FeatureProductCodeMap
          DEFAULT_CUSTOMER_IDENTIFIER: !Ref DefaultCustomerIdentifier
          ADMIN_GROUP: !Ref AdminGroupName
          SIMULATOR_SOURCE_TAG: !If [HasSimulatorEndpoint, 'simulator', 'marketplace']
          LOG_LEVEL: !Ref LogLevel

  ###########################################################################
  # AppSync plumbing: 1 service role + 1 Lambda data source per Lambda +
  # resolvers wired to Query/Mutation field names matching the schema fragment.
  ###########################################################################
  AppSyncServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: appsync.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeFeaturePlatformLambdas
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt ListInstalledFeaturesFunction.Arn
                  - !GetAtt ListCatalogFeaturesFunction.Arn
                  - !GetAtt RegisterFeatureFunction.Arn
                  - !GetAtt GetFeatureLaunchUrlFunction.Arn
                  - !GetAtt CheckFeatureEntitlementFunction.Arn
                  - !GetAtt SubscribeFeatureFunction.Arn
                  - !GetAtt UnsubscribeFeatureFunction.Arn

  ListInstalledFeaturesDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !Ref GraphQLApiId
      Name: FeaturePlatformListInstalledFeatures
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt ListInstalledFeaturesFunction.Arn

  ListCatalogFeaturesDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !Ref GraphQLApiId
      Name: FeaturePlatformListCatalogFeatures
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt ListCatalogFeaturesFunction.Arn

  RegisterFeatureDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !Ref GraphQLApiId
      Name: FeaturePlatformRegisterFeature
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt RegisterFeatureFunction.Arn

  GetFeatureLaunchUrlDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !Ref GraphQLApiId
      Name: FeaturePlatformGetLaunchUrl
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt GetFeatureLaunchUrlFunction.Arn

  CheckFeatureEntitlementDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !Ref GraphQLApiId
      Name: FeaturePlatformCheckEntitlement
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt CheckFeatureEntitlementFunction.Arn

  SubscribeFeatureDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !Ref GraphQLApiId
      Name: FeaturePlatformSubscribeFeature
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt SubscribeFeatureFunction.Arn

  UnsubscribeFeatureDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !Ref GraphQLApiId
      Name: FeaturePlatformUnsubscribeFeature
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !GetAtt UnsubscribeFeatureFunction.Arn

  ListInstalledFeaturesResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !Ref GraphQLApiId
      TypeName: Query
      FieldName: listInstalledFeatures
      DataSourceName: !GetAtt ListInstalledFeaturesDataSource.Name

  ListCatalogFeaturesResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !Ref GraphQLApiId
      TypeName: Query
      FieldName: listCatalogFeatures
      DataSourceName: !GetAtt ListCatalogFeaturesDataSource.Name

  CheckFeatureEntitlementResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !Ref GraphQLApiId
      TypeName: Query
      FieldName: checkFeatureEntitlement
      DataSourceName: !GetAtt CheckFeatureEntitlementDataSource.Name

  GetFeatureLaunchUrlResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !Ref GraphQLApiId
      TypeName: Query
      FieldName: getFeatureLaunchUrl
      DataSourceName: !GetAtt GetFeatureLaunchUrlDataSource.Name

  RegisterFeatureResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !Ref GraphQLApiId
      TypeName: Mutation
      FieldName: registerFeature
      DataSourceName: !GetAtt RegisterFeatureDataSource.Name

  UnregisterFeatureResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !Ref GraphQLApiId
      TypeName: Mutation
      FieldName: unregisterFeature
      DataSourceName: !GetAtt RegisterFeatureDataSource.Name

  SubscribeFeatureResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !Ref GraphQLApiId
      TypeName: Mutation
      FieldName: subscribeFeature
      DataSourceName: !GetAtt SubscribeFeatureDataSource.Name

  UnsubscribeFeatureResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !Ref GraphQLApiId
      TypeName: Mutation
      FieldName: unsubscribeFeature
      DataSourceName: !GetAtt UnsubscribeFeatureDataSource.Name

  ###########################################################################
  # WebUIBucket prefix-scoped policy
  # -----------------------------------------------------------------
  # This is the bucket policy **statement** that the main stack's
  # WebUIBucketPolicy must include when the feature platform is enabled.
  # Because CFN doesn't allow a nested stack to modify a bucket policy owned
  # by the parent, we expose a SSM Parameter here that the main stack's
  # WebUIBucketPolicy `Fn::Transform` (or apply-to-main-stack.md patch) merges.
  #
  # The policy allows any same-account principal tagged with
  #   aws:PrincipalTag/idp:feature-id=<id>
  # to write under features/<id>/*. The ui-deployer custom resource in each
  # feature stack assumes a role that carries that session tag.
  ###########################################################################
  WebUIBucketFeaturePolicyStatement:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${MainStackName}/feature-platform/webui-bucket-policy-statement'
      Type: String
      Description: Policy statement fragment the main stack's WebUIBucketPolicy merges.
      Value: !Sub |
        {
          "Sid": "AllowFeatureStackUiBundleWrites",
          "Effect": "Allow",
          "Principal": { "AWS": "*" },
          "Action": [
            "s3:PutObject",
            "s3:PutObjectAcl",
            "s3:DeleteObject",
            "s3:ListBucket"
          ],
          "Resource": [
            "${WebUIBucketArn}",
            "${WebUIBucketArn}/features/*"
          ],
          "Condition": {
            "StringEquals": {
              "aws:PrincipalAccount": "${AWS::AccountId}"
            },
            "StringLike": {
              "aws:PrincipalTag/idp:feature-id": "*",
              "s3:prefix": [ "features/*" ]
            }
          }
        }

Outputs:

  InstalledFeaturesTableName:
    Description: InstalledFeatures DDB table name
    Value: !Ref InstalledFeaturesTable
    Export:
      Name: !Sub '${MainStackName}-InstalledFeaturesTableName'

  InstalledFeaturesTableArn:
    Description: InstalledFeatures DDB table ARN
    Value: !GetAtt InstalledFeaturesTable.Arn
    Export:
      Name: !Sub '${MainStackName}-InstalledFeaturesTableArn'

  RegisterFeatureLambdaArn:
    Description: ARN of the registerFeature resolver Lambda. Feature stacks grant
      lambda:InvokeFunction to their RegisterFeature custom-resource role.
    Value: !GetAtt RegisterFeatureFunction.Arn
    Export:
      Name: !Sub '${MainStackName}-RegisterFeatureLambdaArn'

  WebUIBucketName:
    Description: Re-export of the main stack's WebUIBucket name (feature stacks
      read this to know where to upload their UMD bundle).
    Value: !Ref WebUIBucketName
    Export:
      Name: !Sub '${MainStackName}-WebUIBucketName'

  WebUIBucketArn:
    Description: Re-export of the main stack's WebUIBucket ARN.
    Value: !Ref WebUIBucketArn
    Export:
      Name: !Sub '${MainStackName}-WebUIBucketArn'

  AppSyncApiUrl:
    Description: Re-export of main stack's AppSync API URL.
    Value: !Ref AppSyncApiUrl
    Export:
      Name: !Sub '${MainStackName}-AppSyncApiUrl'

  AppSyncApiArn:
    Description: Re-export of main stack's AppSync API ARN (feature stacks grant
      appsync:GraphQL on this for their RegisterFeature custom-resource role).
    Value: !Ref GraphQLApiArn
    Export:
      Name: !Sub '${MainStackName}-AppSyncApiArn'

  UserPoolId:
    Description: Re-export of main stack's Cognito User Pool id (feature APIs
      verify JWTs against this).
    Value: !Ref UserPoolId
    Export:
      Name: !Sub '${MainStackName}-UserPoolId'

  UserPoolClientId:
    Description: Re-export of main stack's Cognito User Pool Client id
      (feature HTTP APIs set this as the JWT `audience` when verifying
      tokens issued by the User Pool).
    Value: !Ref UserPoolClientId
    Export:
      Name: !Sub '${MainStackName}-UserPoolClientId'

  TrackingTableName:
    Description: Re-export of main stack's TrackingTable name. Feature
      stacks that need document state (e.g. docs-by-status) read this via
      `Fn::ImportValue '${MainStackName}-TrackingTableName'` and grant
      themselves scoped `dynamodb:Scan`/`Query` on the resulting ARN.
    Value: !Ref TrackingTableName
    Export:
      Name: !Sub '${MainStackName}-TrackingTableName'

  CustomerManagedEncryptionKeyArn:
    Description: >-
      Re-export of the main stack's customer-managed KMS key ARN
      that encrypts the TrackingTable. Feature stacks querying the table
      grant themselves `kms:Decrypt` on this ARN — without it, DynamoDB
      responds with `AccessDeniedException: KMS key access denied`.
    Value: !Ref CustomerManagedEncryptionKeyArn
    Export:
      Name: !Sub '${MainStackName}-CustomerManagedEncryptionKeyArn'

