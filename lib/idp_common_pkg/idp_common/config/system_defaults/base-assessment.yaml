# =============================================================================
# BASE ASSESSMENT - standalone Assessment step carrier (v0.6, slimmed)
# =============================================================================
# In v0.6 the confidence/geometry INFERENCE knobs moved to
# `extraction.confidence` (base-confidence.yaml) and `extraction.geometry`
# (base-geometry.yaml); HITL moved to top-level `hitl`. This block survives only
# as the carrier for the standalone Assessment *step*:
#   - enabled : whether the step runs (also auto-bypassed when extraction already
#               emitted explainability_info); kept in sync with
#               extraction.confidence.enabled by migration.
#   - postHook: the `postAssessment` pipeline-hook point (Feature Platform).
# It will be removed when the standalone step is retired.
# =============================================================================

assessment:
  enabled: true
