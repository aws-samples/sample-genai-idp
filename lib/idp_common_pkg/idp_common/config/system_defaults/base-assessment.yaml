# =============================================================================
# BASE ASSESSMENT - standalone Assessment step hook carrier (v0.6, slimmed)
# =============================================================================
# In v0.6 ALL confidence/geometry settings moved under `extraction`:
#   - inference knobs -> extraction.confidence (base-confidence.yaml)
#   - geometry mode   -> extraction.geometry (base-geometry.yaml)
#   - HITL            -> top-level `hitl`
# Whether assessment runs at all is governed by extraction.confidence.enabled
# (the standalone step also auto-bypasses once extraction emitted
# explainability_info). This block survives ONLY as the carrier for the
# `postAssessment` pipeline-hook point (Feature Platform) and is populated at
# runtime (empty postHook list by default). It will be removed when the
# standalone step is retired.
# =============================================================================

assessment:
  postHook: []
