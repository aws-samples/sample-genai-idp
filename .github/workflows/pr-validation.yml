name: Pull Request Validation

# Block PR merges if tests fail
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, dev]

# Cancel in-progress runs if a new commit is pushed
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for better diffing
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install Python dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip3 install -r requirements-dev.txt
        pip3 install -e lib/idp_common_pkg/
    
    - name: Run Python linting
      run: |
        echo "🔍 Running linting checks..."
        ruff check . --output-format=github
      continue-on-error: false
    
    - name: Run Python tests with coverage
      run: |
        echo "🧪 Running test suite..."
        pytest lib/idp_common_pkg/tests/ -v \
          --cov=lib/idp_common_pkg/idp_common \
          --cov-report=term \
          --cov-report=xml \
          --cov-report=html \
          --junitxml=pytest-report.xml \
          --ignore=lib/idp_common_pkg/tests/unit/test_publish.py \
          --ignore=lib/idp_common_pkg/tests/test_assessment_backward_compatibility.py \
          --ignore=lib/idp_common_pkg/tests/unit/test_document_compression.py \
          --ignore=lib/idp_common_pkg/tests/unit/test_granular_assessment.py \
          --ignore=lib/idp_common_pkg/tests/unit/assessment/test_assessment_enabled_property.py \
          --ignore=lib/idp_common_pkg/tests/unit/assessment/test_bounding_box_integration.py
    
    - name: Check test coverage threshold
      run: |
        echo "📊 Checking coverage threshold..."
        COVERAGE=$(python3 -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); print(tree.getroot().attrib['line-rate'])")
        COVERAGE_PCT=$(python3 -c "print(int(float($COVERAGE) * 100))")
        echo "Current coverage: ${COVERAGE_PCT}%"
        
        # Require at least 70% coverage (adjust as needed)
        if [ "$COVERAGE_PCT" -lt 70 ]; then
          echo "❌ Coverage ${COVERAGE_PCT}% is below 70% threshold"
          exit 1
        else
          echo "✅ Coverage ${COVERAGE_PCT}% meets threshold"
        fi
    
    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: coverage-report
        path: |
          htmlcov/
          coverage.xml
          pytest-report.xml
        retention-days: 30
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: src/ui/package-lock.json
    
    - name: Install UI dependencies
      working-directory: src/ui
      run: npm ci
    
    - name: Run UI linting
      working-directory: src/ui
      run: npm run lint
    
    - name: Check for trailing whitespace
      run: |
        echo "🔍 Checking for trailing whitespace..."
        if git grep -n ' $' -- '*.py' '*.js' '*.jsx' '*.ts' '*.tsx'; then
          echo "❌ Trailing whitespace found!"
          exit 1
        else
          echo "✅ No trailing whitespace found"
        fi
    
    - name: Validate CloudFormation templates
      run: |
        echo "☁️ Validating CloudFormation templates..."
        for template in $(find . -name "*.yaml" -o -name "*.yml" | grep -E "(template|cfn|cloudformation)" | grep -v node_modules | grep -v .aws-sam); do
          echo "Validating: $template"
          aws cloudformation validate-template --template-body file://$template --region us-east-1 || true
        done
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
        AWS_DEFAULT_REGION: eu-central-1
    
    - name: PR validation summary
      if: always()
      run: |
        echo ""
        echo "✅ PR Validation Complete!"
        echo ""
        echo "Results:"
        echo "  - Python linting: ✓"
        echo "  - Python tests: ✓"
        echo "  - Coverage check: ✓"
        echo "  - UI linting: ✓"
        echo "  - Whitespace check: ✓"
        echo ""
        echo "This PR is ready for review!"

  # Add a required status check that summarizes all jobs
  summary:
    runs-on: ubuntu-latest
    needs: [validate]
    if: always()
    steps:
    - name: Check validation status
      run: |
        if [ "${{ needs.validate.result }}" != "success" ]; then
          echo "❌ PR validation failed. Please fix the issues before merging."
          exit 1
        fi
        echo "✅ All validation checks passed!"
