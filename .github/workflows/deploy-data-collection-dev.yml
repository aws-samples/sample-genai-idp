name: Deploy Data Collection Stack - Dev

on:
  push:
    branches:
      - dev
    paths:
      - 'stacks/data-collection/**'
      - 'src/data_collection/**'
      - 'tests/data_collection/**'
      - '.github/workflows/deploy-data-collection-dev.yml'

  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual deployment'

env:
  AWS_REGION: us-east-1
  STACK_NAME: fiscalshield-dc-dev
  ENVIRONMENT: dev

jobs:
  deploy:
    name: Deploy to Dev Environment
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aws-sam-cli boto3 pytest pytest-cov

      - name: 🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🧪 Run unit tests
        run: |
          if [ -d "tests/data_collection/unit" ]; then
            pytest tests/data_collection/unit/ -v --cov=src/data_collection --cov-report=term-missing
          else
            echo "No unit tests found yet - skipping"
          fi

      - name: ✅ Validate CloudFormation template
        working-directory: stacks/data-collection
        run: |
          sam validate --lint

      - name: 🔨 Build SAM application
        working-directory: stacks/data-collection
        run: |
          sam build --config-env dev --parallel --cached

      - name: 🚀 Deploy to Dev
        working-directory: stacks/data-collection
        run: |
          sam deploy \
            --config-env dev \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --region ${{ env.AWS_REGION }}

      - name: 📊 Get stack outputs
        id: stack-outputs
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs' \
            --output json)
          
          echo "Stack outputs:"
          echo "$OUTPUTS" | jq -r '.[] | "\(.OutputKey) = \(.OutputValue)"'

      - name: 🧪 Run smoke tests
        run: |
          echo "🔍 Running Data Collection Stack smoke tests..."
          
          # Check DynamoDB tables exist
          TABLES=(
            "fiscalshield-dc-dev-FilingEvents"
            "fiscalshield-dc-dev-CompanyEvents"
            "fiscalshield-dc-dev-HMRCData"
          )
          
          for table in "${TABLES[@]}"; do
            echo "Checking table: $table"
            aws dynamodb describe-table --table-name "$table" --region ${{ env.AWS_REGION }} > /dev/null
            if [ $? -eq 0 ]; then
              echo "✅ Table $table exists"
            else
              echo "❌ Table $table not found"
              exit 1
            fi
          done
          
          # Check secrets exist
          SECRETS=(
            "fiscalshield-dc-dev-CompaniesHouseAPI"
            "fiscalshield-dc-dev-HMRCAPI"
            "fiscalshield-dc-dev-BankingAPI"
          )
          
          for secret in "${SECRETS[@]}"; do
            echo "Checking secret: $secret"
            aws secretsmanager describe-secret --secret-id "$secret" --region ${{ env.AWS_REGION }} > /dev/null
            if [ $? -eq 0 ]; then
              echo "✅ Secret $secret exists"
            else
              echo "❌ Secret $secret not found"
              exit 1
            fi
          done
          
          echo "🎉 All smoke tests passed!"

      - name: 📝 Comment on commit
        uses: actions/github-script@v7
        if: github.event_name == 'push'
        with:
          script: |
            const sha = context.sha;
            const shortSha = sha.substring(0, 7);
            
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
              body: `## ✅ Data Collection Stack Deployed to Dev
              
              **Environment:** dev
              **Stack:** fiscalshield-dc-dev
              **Region:** ${{ env.AWS_REGION }}
              **Commit:** ${shortSha}
              **Status:** Success
              
              ### Resources Created/Updated:
              - ✅ DynamoDB Tables (FilingEvents, CompanyEvents, HMRCData)
              - ✅ Secrets Manager (CompaniesHouseAPI, HMRCAPI, BankingAPI)
              - ✅ IAM Roles
              - ✅ CloudWatch Log Groups
              
              ### Next Steps:
              1. Update Companies House API key in Secrets Manager
              2. Implement Lambda functions
              3. Test API endpoints
              
              [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            });

      - name: ⚠️ Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const shortSha = sha.substring(0, 7);
            
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
              body: `## ❌ Data Collection Stack Deployment Failed
              
              **Environment:** dev
              **Stack:** fiscalshield-dc-dev
              **Commit:** ${shortSha}
              **Status:** Failed
              
              [View failed workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              
              Please check the logs and troubleshoot the issue.`
            });
