name: Deploy to Dev

# Automatically deploy to dev environment when dev branch is updated
on:
  push:
    branches: [dev]

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev  # 👈 Add this line to use the 'dev' environment secrets
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Set up AWS SAM CLI
      uses: aws-actions/setup-sam@v2
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
        aws-region: eu-central-1
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
        AWS_DEFAULT_REGION: eu-central-1
    
    - name: Install dependencies
      run: |
        pip install boto3 rich typer PyYAML botocore setuptools ruff black
    
    - name: Build and publish
      run: |
        python3 publish.py fiscalshield-dev idp eu-central-1 --lint off
    
    - name: Deploy to dev stack
      run: |
        aws cloudformation update-stack \
          --stack-name fiscalshield-idp-dev \
          --template-url https://s3.eu-central-1.amazonaws.com/fiscalshield-dev-eu-central-1/idp/idp-main.yaml \
          --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
          --region eu-central-1 \
          --parameters ParameterKey=AdminEmail,UsePreviousValue=true \
                       ParameterKey=IDPPattern,UsePreviousValue=true
    
    - name: Wait for deployment to complete
      run: |
        echo "⏳ Waiting for CloudFormation stack to complete..."
        echo "This may take 15-20 minutes..."
        aws cloudformation wait stack-update-complete \
          --stack-name fiscalshield-idp-dev \
          --region eu-central-1
        
        if [ $? -eq 0 ]; then
          echo "✓ CloudFormation stack update completed successfully"
        else
          echo "✗ CloudFormation stack update failed or timed out"
          exit 1
        fi
    
    - name: Force update Lambda functions (bypass CloudFormation caching)
      run: |
        echo "🔄 Force updating Lambda functions with latest code..."
        chmod +x scripts/force-update-lambdas.sh
        ./scripts/force-update-lambdas.sh
      env:
        STACK_NAME: fiscalshield-idp-dev
        REGION: eu-central-1
    
    - name: Run smoke tests
      run: |
        echo "🔍 Running post-deployment smoke tests..."
        chmod +x scripts/smoke-test.sh
        ./scripts/smoke-test.sh
      env:
        STACK_NAME: fiscalshield-idp-dev
        REGION: eu-central-1
    
    - name: Deployment summary
      run: |
        echo "✅ Dev deployment complete!"
        echo "Stack URL: https://eu-central-1.console.aws.amazon.com/cloudformation/home?region=eu-central-1#/stacks/stackinfo?stackId=fiscalshield-idp-dev"
    
    - name: Send deployment notification
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const status = '${{ job.status }}';
          const emoji = status === 'success' ? '✅' : '❌';
          const color = status === 'success' ? '28a745' : 'dc3545';
          
          const body = `${emoji} **Dev Deployment ${status.toUpperCase()}**
          
          **Branch:** \`${context.ref}\`
          **Commit:** \`${context.sha.substring(0, 7)}\`
          **Author:** @${context.actor}
          **Workflow:** [${context.workflow}](${context.payload.repository.html_url}/actions/runs/${context.runId})
          
          ${status === 'success' ? '🎉 Changes are now live in dev environment!' : '⚠️ Deployment failed. Check logs for details.'}
          `;
          
          // Create a comment on the commit
          await github.rest.repos.createCommitComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: context.sha,
            body: body
          });
