name: Test

# Run tests on every push to any branch
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov boto3 ruff
        pip install -e lib/idp_common_pkg/
    
    - name: Run Python linting
      run: |
        ruff check .
    
    - name: Run Python tests
      run: |
        pytest lib/idp_common_pkg/tests/ -v --cov=lib/idp_common_pkg/idp_common
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install UI dependencies
      working-directory: src/ui
      run: npm ci
    
    - name: Run UI linting
      working-directory: src/ui
      run: npm run lint
    
    - name: Check for trailing whitespace
      run: |
        # Fail if trailing whitespace found in source files
        ! git grep -n ' $' -- '*.py' '*.js' '*.jsx' '*.ts' '*.tsx' || \
          (echo "❌ Trailing whitespace found!" && exit 1)
