          The person who created the document. Look for 'author', 'creator', or
          'sender'.
      recipient:
        type: string
        description: >-
          The person for whom the document is intended. May be indicated by
          'recipient', 'to', or 'addressee'.
      content_summary:
        type: string
        description: >-
          A brief description of the document's contents. Look for 'summary',
