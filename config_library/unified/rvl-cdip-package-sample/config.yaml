        type: string
        description: >-
          The iteration or release number. May be indicated by 'version',
          'revision', or 'release', often followed by a number or code.
      technical_details:
        type: string
        description: >-
          Specific characteristics and capabilities. Look for sections labeled
          'specifications', 'tech specs', or 'details', often presented in a
          detailed list.
      requirements:
        type: string
        description: >-
          Necessary conditions or resources. May be introduced with
          'requirements', 'prerequisites', or 'needed'.
      compatibility:
        type: string
        description: >-
          What the product can work with. Look for text following 'compatible
          with', 'works with', or 'supports'.
      dimensions:
        type: string
        description: >-
          Physical measurements of the product. Often labeled as 'dimensions',
          'size', or 'measurements', usually including length, width, height,
          etc.
      materials:
        type: string
        description: >-
          What the product is made from. May be indicated by 'materials',
          'composition', or phrases like 'made from'.
      standards:
        type: string
        description: >-
          Industry guidelines or certifications met. Look for references to
          'standards', 'certifications', or 'compliance'.
      revision_history:
        type: string
        description: >-
          Record of changes to the specification. Often labeled as 'revisions',
          'changes', or 'updates', typically in a table format.
      approval_info:
        type: string
        description: >-
          Details about who has validated the specification. May be indicated by
          phrases like 'approved by', 'certified by', or 'validated'.
