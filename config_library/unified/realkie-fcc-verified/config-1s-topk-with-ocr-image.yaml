      \            \"dataType\" : \"number\",\n                        \"description\"\
      \ : \"Dependent Age\"\n                    }\n                ]\n          \
      \  }\n        }\n    ]\n}"
  with_ground_truth:
    max_tokens: '10000'
    model_id: us.amazon.nova-pro-v1:0
    system_prompt: You are an expert in processing forms. Extracting data from images
      and documents. Use provided ground truth data as reference to optimize field
      extraction and ensure consistency with expected document structure and field
      definitions.
    temperature: '0.0'
    top_p: '0.0'
    user_prompt: 'This image contains unstructured data. Analyze the data line by
      line using the provided ground truth as reference.                         <GROUND_TRUTH_REFERENCE>
      {ground_truth_json} </GROUND_TRUTH_REFERENCE> Ground truth reference JSON has
      the fields we are interested in extracting from the document/image. Use the
      ground truth to optimize field extraction. Match field names, data types, and
      groupings from the reference. Image may contain multiple pages, process all
      pages. Extract all field names including those without values. Do not change
      the group name and field name from ground truth in the extracted data json.
      Add field_description field for every field which will contain instruction to
      LLM to extract the field data from the image/document. Add data_type field for
      every field.  Add two fields document_class and document_description.  For document_class
      generate a short name based on the document content like W4, I-9, Paystub.  For
      document_description generate a description about the document in less than
      50 words. If the group repeats and follows table format, update the attributeType
      as "list".                          Do not extract the values. Format the extracted
      data using the below JSON format: Format the extracted groups and fields using
      the below JSON format:'
  without_ground_truth:
    max_tokens: '10000'
    model_id: us.amazon.nova-pro-v1:0
    system_prompt: You are an expert in processing forms. Extracting data from images
      and documents. Analyze forms line by line to identify field names, data types,
      and organizational structure. Focus on creating comprehensive blueprints for
      document processing without extracting actual values.
    temperature: '0.0'
    top_p: '0.0'
    user_prompt: 'This image contains forms data. Analyze the form line by line. Image
      may contains multiple pages, process all the pages.  Form may contain multiple
      name value pair in one line.  Extract all the names in the form including the
      name value pair which doesn''t have value.  Organize them into groups, extract
      field_name, data_type and field description Field_name should be less than 60
      characters, should not have space use ''-'' instead of space. field_description
      is a brief description of the field and the location of the field like box number
      or line number in the form and section of the form. Field_name should be unique
      within the group. Add two fields document_class and document_description.  For
      document_class generate a short name based on the document content like W4,
      I-9, Paystub.  For document_description generate a description about the document
      in less than 50 words.  Group the fields based on the section they are grouped
      in the form. Group should have attributeType as "group". If the group repeats
      and follows table format, update the attributeType as "list". Do not extract
      the values. Return the extracted data in JSON format. Format the extracted data
      using the below JSON format: Format the extracted groups and fields using the
      below JSON format:'
evaluation:
  enabled: true
  llm_method:
    max_tokens: '4096'
    model: us.anthropic.claude-sonnet-4-20250514-v1:0
    system_prompt: You are an evaluator that helps determine if the predicted and
      expected values match for document attribute extraction. You will consider the
      context and meaning rather than just exact string matching.
    task_prompt: "I need to evaluate attribute extraction for a document of class:\
      \ {DOCUMENT_CLASS}. For the attribute named \"{ATTRIBUTE_NAME}\" described as\
      \ \"{ATTRIBUTE_DESCRIPTION}\": - Expected value: {EXPECTED_VALUE} - Actual value:\
      \ {ACTUAL_VALUE} Do these values match in meaning, taking into account formatting\
      \ differences, word order, abbreviations, and semantic equivalence? Provide\
      \ your assessment as a JSON with three fields: - \"match\": boolean (true if\
      \ they match, false if not) - \"score\": number between 0 and 1 representing\
      \ the confidence/similarity score - \"reason\": brief explanation of your decision\
      \ Respond ONLY with the JSON and nothing else. Here's the exact format: {\n\
      \  \"match\": true or false,\n  \"score\": 0.0 to 1.0,\n  \"reason\": \"Your\
      \ explanation here\"\n}"
    temperature: '0.0'
    top_k: '5'
    top_p: '0.0'
extraction:
  agentic:
    enabled: false
    review_agent: false
  image:
    target_height: 1200
    target_width: 1000
  max_tokens: '40000'
  model: us.anthropic.claude-haiku-4-5-20251001-v1:0
  system_prompt: You are a document assistant. Respond only with JSON. Never make
    up data, only provide data found in the document being provided.
  task_prompt: "<background> You are an expert in document analysis and information\
    \ extraction. You can understand and extract key information from documents classified\
    \ as type: \n{DOCUMENT_CLASS}. </background>\n<task> Provide your 4 best guesses 
    and the probability that each is correct (0.0 to 1.0) for each attribute listed below. 
    Give ONLY the guesses and probabilities, no other words or explanation.</task>
    \n<extraction-guidelines> Guidelines:\n 1. All dates should be in\
    \ MM/DD/YY format\n 2. Only consider values that are present in the provided document. Do not invent attribute values.\
    3. Exract each entity candidate exactly how it is presented in the document. E.g. do not change \"M\" to \"Monday\" 
    or change the date from \"01/04\" to \"1/04\".\
    4. For each extracted attribute key, the value MUST be a nested object formatted\
    \ exactly like this:\n        {\n          \"G1\": \"<1st most likely guess, as\
    \ short as possible>\",\n          \"P1\": <probability between 0.0 and 1.0>,\n\
    \          \"G2\": \"<2nd most likely guess, as short as possible>\",\n       \
    \   \"P2\": <probability between 0.0 and 1.0>,\n          \"G3\": \"<3rd most\
    \ likely guess, as short as possible>\",\n          \"P3\": <probability between\
    \ 0.0 and 1.0>,\n          \"G4\": \"<4th most likely guess, as short as possible>\"\
    ,\n          \"P4\": <probability between 0.0 and 1.0>\n        }\n</extraction-guidelines>\n\
    If the attributes section below contains a list of attribute names and descriptions,\
    \ then output only those attributes, using the provided descriptions as guidance\
    \ for finding the correct values. \n<attributes> {ATTRIBUTE_NAMES_AND_DESCRIPTIONS}\
    \ </attributes>\n<<CACHEPOINT>>\n\
    <document_image> {DOCUMENT_IMAGE} </document_image>\n<output-format>\n\
    <ocr-text-confidence-results> {OCR_TEXT_CONFIDENCE} </ocr-text-confidence-results>\n\
    Give ONLY the JSON object containing the guesses and probabilities. 
    Do not think step-by-step, do not show your work, and do not provide 
    any reasoning, justifications, or extra commentary whatsoever.

    For SIMPLE attributes:
    {
      \"simple_attribute_name\": {
        \"G1\": \"<1st most likely guess, as short as possible>\",
        \"P1\": <probability between 0.0 and 1.0>,
        \"G2\": \"<2nd most likely guess, as short as possible>\",
        \"P2\": <probability between 0.0 and 1.0>,
        \"G3\": \"<3rd most likely guess, as short as possible>\",
        \"P3\": <probability between 0.0 and 1.0>,
        \"G4\": \"<4th most likely guess, as short as possible>\",
        \"P4\": <probability between 0.0 and 1.0>
      }
    }
    
    For LIST attributes (assess EACH item individually):
    {
      \"list_attribute_name\": [
        {
          \"item_attribute_1\": {
            \"G1\": \"<1st guess>\",
            \"P1\": <probability>,
            \"G2\": \"<2nd guess>\",
            \"P2\": <probability>,
            \"G3\": \"<3rd guess>\",
            \"P3\": <probability>,
            \"G4\": \"<4th guess>\",
            \"P4\": <probability>
          },
          \"item_attribute_2\": {
            \"G1\": \"<1st guess>\",
            \"P1\": <probability>,
            \"G2\": \"<2nd guess>\",
            \"P2\": <probability>,
            \"G3\": \"<3rd guess>\",
            \"P3\": <probability>,
            \"G4\": \"<4th guess>\",
            \"P4\": <probability>
          }
        }
      ]
    }
    </output-format>"
  temperature: '0.0'
  top_k: '5'
  top_p: '0.0'
