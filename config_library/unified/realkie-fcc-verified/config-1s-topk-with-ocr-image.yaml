      \ : \"Brief summary of the document\",\n    \"groups\" : [\n        {\n    \
      \        \"name\" : \"PersonalInformation\",\n            \"description\" :\
      \ \"Personal information of Tax payer\",\n            \"attributeType\" : \"\
      group\",\n            \"groupAttributes\" : [\n                {\n         \
      \           \"name\": \"FirstName\",\n                    \"dataType\" : \"\
