AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Bedrock Knowledge Base with S3 Vectors Backend for GenAI IDP Accelerator'

Parameters:
  pS3VectorsCatalogTableName:
    Type: String
    Description: 'Name of the DynamoDB catalog table used for session management'
  pS3VectorsCatalogTableArn:
    Type: String
    Description: 'ARN of the DynamoDB catalog table used for session management'
  pStackName:
    Type: String
    Description: 'Name of the parent CloudFormation stack'
  pLogLevel:
    Type: String
    Default: INFO
  pLogRetentionDays:
    Type: Number
    Default: 30
  pPermissionsBoundaryArn:
    Type: String
    Default: ""
  pCustomerManagedEncryptionKeyArn:
    Type: String
    Description: "ARN of the customer-managed KMS key for encryption (must be the key ARN, not the alias)"
    Default: ""
  pAlertsTopicArn:
    Type: String
  pOutputBucket:
    Type: String
  pWorkingBucket:
    Type: String
  pConfigurationTable:
    Type: String
  pKnowledgeBaseModelId:
    Type: String
  pGuardrailId:
    Type: String
    Default: ""
  pGuardrailVersion:
    Type: String
    Default: ""
  LightweightLLMModelId:
    Type: String
    Default: "amazon.nova-micro-v1:0"
    Description: Lightweight LLM model ID for local region
  CrossRegionLightweightLLMModelId:
    Type: String
    Default: "us.amazon.nova-micro-v1:0"
    Description: Cross-region LLM model ID (with region prefix for cross-region access)
  VectorIndexName:
    Type: String
    Description: 'Name for the S3 vector index'
    Default: 'bedrock-kb-s3vectors-index'
  EmbeddingModelId:
    Type: String
    Default: 'amazon.titan-embed-text-v2:0'
  pKnowledgeBaseBucketName:
    Type: String
    Default: ""
    Description: 'S3 bucket name for knowledge base data source (will be created if empty)'
  pInputDocumentUploadFolderPrefix:
    Type: String
    Default: ""
    Description: 'S3 prefix for source documents'
  pChunkingStrategy:
    Type: String
    AllowedValues:
      - Default chunking
      - Fixed-size chunking
      - No chunking
    Default: Fixed-size chunking
    Description: 'Chunking strategy for document processing'
  pMaxTokens:
    Type: Number
    MinValue: 20
    MaxValue: 8192
    Default: 300
    Description: 'Maximum tokens per chunk for fixed-size chunking'
  pOverlapPercentage:
    Type: Number
    MinValue: 1
    MaxValue: 99
    Default: 15
    Description: 'Overlap percentage between chunks'
  pSyncScheduleExpression:
    Type: String
    Default: "cron(0 0 * * ? *)"
    Description: 'Schedule for data source synchronization'

Mappings:
  EmbeddingModelDimensions:
    amazon.titan-embed-text-v1:
      Dimension: 1536
    amazon.titan-embed-text-v2:0:
      Dimension: 1024
    cohere.embed-english-v3:
      Dimension: 1024
    cohere.embed-multilingual-v3:
      Dimension: 1024

Conditions:
  pHasPermissionsBoundary: !Not [!Equals [!Ref pPermissionsBoundaryArn, ""]]
  pHasGuardrailConfig: !And [!Not [!Equals [!Ref pGuardrailId, ""]], !Not [!Equals [!Ref pGuardrailVersion, ""]]]
  pHasCustomerManagedEncryptionKey: !Not [!Equals [!Ref pCustomerManagedEncryptionKeyArn, ""]]
  pCreateKnowledgeBaseBucket: !Equals [!Ref pKnowledgeBaseBucketName, ""]
  pHasInputDocumentUploadFolderPrefix: !Not [!Equals [!Ref pInputDocumentUploadFolderPrefix, ""]]
  pIsChunkingStrategyFixed: !Equals [!Ref pChunkingStrategy, "Fixed-size chunking"]
  pIsChunkingStrategyDefault: !Equals [!Ref pChunkingStrategy, "Default chunking"]
  pIsChunkingStrategyFixedOrDefault: !Or [!Condition pIsChunkingStrategyFixed, !Condition pIsChunkingStrategyDefault]

Resources:

  # Helper function to get adjusted stack name
  GetAdjustedStackNameFunction:
    Type: AWS::Serverless::Function
    Properties:
      PermissionsBoundary: !If [pHasPermissionsBoundary, !Ref pPermissionsBoundaryArn, !Ref AWS::NoValue]
      Handler: index.handler
      Runtime: python3.12
      Timeout: 30
      InlineCode: |
        import cfnresponse
        def handler(event, context):
            output = event['ResourceProperties'].get('InputString', '').lower()
            output = output[:32]
            responseData = {'OutputString': output}
            cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData)
      Environment:
        Variables:
          LOG_LEVEL: !Ref pLogLevel

  AdjustedStackName:
    Type: Custom::GetLowercase
    Properties:
      ServiceToken: !GetAtt GetAdjustedStackNameFunction.Arn
      InputString: !Ref pStackName

  # Note: Using existing OutputBucket from main template as S3 data source
  # No need to create a separate bucket

  # S3 Vectors resources for Knowledge Base backend
  S3VectorsProvisionerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/bedrock_kb_provisioner
      Handler: index.handler
      Runtime: python3.12
      Timeout: 300
      MemorySize: 512
      PermissionsBoundary: !If [pHasPermissionsBoundary, !Ref pPermissionsBoundaryArn, !Ref AWS::NoValue]
      Environment:
        Variables:
          LOG_LEVEL: !Ref pLogLevel
          STACK_NAME: !Ref pStackName
          KMS_KEY_ARN: !Ref pCustomerManagedEncryptionKeyArn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3vectors:CreateVectorBucket
                - s3vectors:CreateIndex
                - s3vectors:ListVectorBuckets
                - s3vectors:DescribeVectorBucket
              Resource: "*"
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
                - kms:CreateGrant
              Resource: !Ref pCustomerManagedEncryptionKeyArn

  S3VectorsProvisioner:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt S3VectorsProvisionerFunction.Arn
      VectorBucketName: !Sub "${pStackName}-kb-s3vectors"
      VectorIndexName: !Ref VectorIndexName
      VectorDimension: !FindInMap 
        - EmbeddingModelDimensions
        - !Ref EmbeddingModelId
        - Dimension
      DistanceMetric: "cosine"

  # IAM Role for Bedrock Knowledge Base
  KnowledgeBaseServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Sub ${AWS::AccountId}
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*"
      PermissionsBoundary: !If [pHasPermissionsBoundary, !Ref pPermissionsBoundaryArn, !Ref AWS::NoValue]
      Policies:
        - PolicyName: bedrock-invoke-model
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/*"
        - PolicyName: s3vectors-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3vectors:PutVectors
                  - s3vectors:QueryVectors
                  - s3vectors:GetVectors
                  - s3vectors:ListVectors
                Resource: "*"
        - PolicyName: s3-read-objects
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:${AWS::Partition}:s3:::${pOutputBucket}"
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${pOutputBucket}/*"
        - !If
          - pHasCustomerManagedEncryptionKey
          - PolicyName: kms-key
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - kms:Encrypt
                    - kms:Decrypt
                    - kms:ReEncrypt*
                    - kms:GenerateDataKey*
                    - kms:DescribeKey
                  Resource: !Ref pCustomerManagedEncryptionKeyArn
          - !Ref "AWS::NoValue"

  # Bedrock Knowledge Base
  KnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    DependsOn: S3VectorsProvisioner
    Properties:
      Description: !Sub "Bedrock Knowledge Base with S3 Vectors backend for ${pStackName}"
      KnowledgeBaseConfiguration:
        Type: VECTOR
        VectorKnowledgeBaseConfiguration:
          EmbeddingModelArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}"
      Name: !Sub "${pStackName}-kb"
      RoleArn: !GetAtt KnowledgeBaseServiceRole.Arn
      StorageConfiguration:
        Type: S3_VECTORS
        S3VectorsConfiguration:
          VectorBucketArn: !Sub "arn:${AWS::Partition}:s3vectors:${AWS::Region}:${AWS::AccountId}:bucket/${pStackName}-kb-s3vectors"
          IndexArn: !Sub "arn:${AWS::Partition}:s3vectors:${AWS::Region}:${AWS::AccountId}:index/${pStackName}-kb-s3vectors/${VectorIndexName}"
          IndexName: !Ref VectorIndexName

  # Data Source for Knowledge Base
  S3DataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      DataDeletionPolicy: DELETE
      DataSourceConfiguration:
        Type: S3
        S3Configuration:
          BucketArn: !Sub "arn:${AWS::Partition}:s3:::${pOutputBucket}"
          InclusionPrefixes: !If
            - pHasInputDocumentUploadFolderPrefix
            - !Split [",", !Ref pInputDocumentUploadFolderPrefix]
            - !Ref AWS::NoValue
      Description: !Sub "S3 Data Source for ${pStackName} Knowledge Base"
      KnowledgeBaseId: !Ref KnowledgeBase
      Name: !Sub "${pStackName}-s3-datasource"
      VectorIngestionConfiguration:
        ChunkingConfiguration:
          ChunkingStrategy: !If
            - pIsChunkingStrategyFixedOrDefault
            - FIXED_SIZE
            - NONE
          FixedSizeChunkingConfiguration: !If
            - pIsChunkingStrategyFixedOrDefault
            - MaxTokens: !If
                - pIsChunkingStrategyFixed
                - !Ref pMaxTokens
                - 300
              OverlapPercentage: !If
                - pIsChunkingStrategyFixed
                - !Ref pOverlapPercentage
                - 20
            - !Ref AWS::NoValue

  # Note: Query function removed - now using the main query_knowledgebase_resolver
  # which works with both OpenSearch and S3 vectors backends through Bedrock KB APIs

  # Ingestion management function
  # Data Flow: OUTPUT_BUCKET (S3 data source) → Bedrock KB ingestion → S3 vectors backend
  # This function only triggers ingestion jobs - Bedrock handles the rest automatically
  BedrockKBIngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/bedrock_kb_ingestion
      Handler: index.handler
      Runtime: python3.12
      Timeout: 300
      MemorySize: 512
      PermissionsBoundary: !If [pHasPermissionsBoundary, !Ref pPermissionsBoundaryArn, !Ref AWS::NoValue]
      Environment:
        Variables:
          LOG_LEVEL: !Ref pLogLevel
          KNOWLEDGE_BASE_ID: !Ref KnowledgeBase
          DATA_SOURCE_ID: !GetAtt S3DataSource.DataSourceId
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:StartIngestionJob
              Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBase}"

  # Start initial ingestion job
  StartIngestionJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      Runtime: python3.12
      Timeout: 600
      MemorySize: 128
      PermissionsBoundary: !If [pHasPermissionsBoundary, !Ref pPermissionsBoundaryArn, !Ref AWS::NoValue]
      InlineCode: |
        import boto3
        import json
        import cfnresponse
        import logging
        
        logger = logging.getLogger()
        logger.setLevel(logging.INFO)
        
        client = boto3.client('bedrock-agent')
        
        def handler(event, context):
            try:
                if event['RequestType'] in ['Create', 'Update']:
                    knowledge_base_id = event['ResourceProperties']['knowledgeBaseId']
                    data_source_id = event['ResourceProperties']['dataSourceId']
                    
                    response = client.start_ingestion_job(
                        knowledgeBaseId=knowledge_base_id,
                        dataSourceId=data_source_id,
                        description="Initial ingestion job started by CloudFormation"
                    )
                    logger.info(f"Started ingestion job: {response}")
                
                cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
            except Exception as e:
                logger.error(f"Error: {e}")
                cfnresponse.send(event, context, cfnresponse.SUCCESS, {})  # Don't fail stack on ingestion errors
      Environment:
        Variables:
          LOG_LEVEL: !Ref pLogLevel
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:StartIngestionJob
              Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBase}"

  StartInitialIngestionJob:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt StartIngestionJobFunction.Arn
      knowledgeBaseId: !Ref KnowledgeBase
      dataSourceId: !GetAtt S3DataSource.DataSourceId

  # Scheduler for periodic ingestion
  IngestionSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      PermissionsBoundary: !If [pHasPermissionsBoundary, !Ref pPermissionsBoundaryArn, !Ref AWS::NoValue]
      Policies:
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt BedrockKBIngestionFunction.Arn

  IngestionSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: "Schedule to trigger Knowledge Base data source sync"
      FlexibleTimeWindow:
        Mode: "OFF"
      ScheduleExpression: !Ref pSyncScheduleExpression
      ScheduleExpressionTimezone: "UTC"
      State: ENABLED
      Target:
        Arn: !GetAtt BedrockKBIngestionFunction.Arn
        RoleArn: !GetAtt IngestionSchedulerRole.Arn

  # CloudWatch Alarms for monitoring
  KnowledgeBaseQueryLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${pStackName}-KnowledgeBase-HighQueryLatency'
      AlarmDescription: 'Knowledge Base query latency exceeds 30 seconds'
      MetricName: KnowledgeBaseQueryLatency
      Namespace: !Ref pStackName
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 30000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref pAlertsTopicArn

  KnowledgeBaseQueryFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${pStackName}-KnowledgeBase-QueryFailures'
      AlarmDescription: 'Knowledge Base query success rate below 95%'
      MetricName: KnowledgeBaseQuerySuccessRate
      Namespace: !Ref pStackName
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 95
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref pAlertsTopicArn

Outputs:
  KnowledgeBaseId:
    Description: 'ID of the Bedrock Knowledge Base'
    Value: !Ref KnowledgeBase
    Export:
      Name: !Sub "${AWS::StackName}-KnowledgeBaseId"

  KnowledgeBaseArn:
    Description: 'ARN of the Bedrock Knowledge Base'
    Value: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBase}"
    Export:
      Name: !Sub "${AWS::StackName}-KnowledgeBaseArn"

  DataSourceId:
    Description: 'ID of the S3 Data Source'
    Value: !GetAtt S3DataSource.DataSourceId
    Export:
      Name: !Sub "${AWS::StackName}-DataSourceId"

  KnowledgeBaseBucketName:
    Description: 'Name of the S3 bucket used for knowledge base data source'
    Value: !If
      - pCreateKnowledgeBaseBucket
      - !Ref KnowledgeBaseBucket
      - !Ref pKnowledgeBaseBucketName
    Export:
      Name: !Sub "${AWS::StackName}-KnowledgeBaseBucketName"

  # Note: Query function ARN removed - now using main query_knowledgebase_resolver

  BedrockKBIngestionFunctionArn:
    Description: 'ARN of the Bedrock Knowledge Base Ingestion Lambda function'
    Value: !GetAtt BedrockKBIngestionFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-IngestionFunctionArn"

  S3VectorsCatalogTableName:
    Description: 'Name of the DynamoDB catalog table used for session management'
    Value: !Ref pS3VectorsCatalogTableName

  S3VectorsCatalogTableArn:
    Description: 'ARN of the DynamoDB catalog table used for session management'
    Value: !Ref pS3VectorsCatalogTableArn

  EmbeddingModelId:
    Description: 'Configured embedding model for vector generation'
    Value: !Ref EmbeddingModelId

  VectorIndexName:
    Description: 'Name of the S3 vectors index'
    Value: !Ref VectorIndexName
