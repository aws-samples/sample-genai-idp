[pytest]
# Register the shared markers so `@pytest.mark.unit` / `-m unit` don't emit
# PytestUnknownMarkWarning when this suite is run standalone (the gate invokes
# each root as its own `pytest -m "not integration" <root>`).
markers =
    unit: mark a test as a unit test
    integration: mark a test as an integration test
