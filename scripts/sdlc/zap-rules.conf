# OWASP ZAP rule configuration for the IDP UI-API DAST probe.
# Consumed by zap-api-scan.py via `-c zap-rules.conf` (see validate_zap_dast in
# scripts/sdlc/codebuild_deployment.py).
#
# Format: <pluginId> <TAB> <action> <TAB> <optional comment>
#   action = IGNORE | WARN | FAIL
#     IGNORE — drop the alert entirely (known false positive / not applicable).
#     WARN   — report but do not fail (the default posture for this probe today).
#     FAIL   — (future) fail the build. The probe is WARN-only right now
#              (validate_zap_dast never gates), so a FAIL here is surfaced but
#              does not yet fail the pipeline; flip the `# TODO promote` gate in
#              validate_zap_dast to make FAIL rules block a merge.
#
# TRIAGE WORKFLOW (WARN → promote):
#   1. Run the probe; read the alert list in the build log / uploaded HTML report.
#   2. For each recurring finding: confirm it's real, then either fix the app
#      (best), IGNORE it here (documented false positive), or leave it WARN.
#   3. When a rule's findings are clean/actionable, change WARN → FAIL and enable
#      the gate in validate_zap_dast to make it block regressions.
#
# Plugin ids: https://www.zaproxy.org/docs/alerts/  (pscan/ascan rule ids)
# Lines beginning with # and blank lines are ignored by ZAP.

# --- Rules intentionally ignored for this API -----------------------------
# The UI API returns JSON, not HTML, and sits behind CloudFront/API Gateway.
# These passive rules are noisy or not applicable to a pure JSON API; revisit
# if the surface changes.
10096	IGNORE	(Timestamp Disclosure - low-signal on JSON APIs)
10027	IGNORE	(Information Disclosure - Suspicious Comments; JSON API)
100000	IGNORE	(A Client Error response code - expected: ZAP posts malformed bodies, API correctly returns 400)
10049	IGNORE	(Non-Storable Content - expected/correct for a dynamic authenticated JSON API)

# --- Everything else: WARN (report, don't gate — promote after triage) -----
# Security-header + transport rules we most want to promote to FAIL first once
# the baseline is clean. Left as WARN until triaged.
10020	WARN	(Missing Anti-clickjacking Header / X-Frame-Options)
10021	WARN	(X-Content-Type-Options Header Missing)
10035	WARN	(Strict-Transport-Security Header)
10038	WARN	(Content Security Policy (CSP) Header Not Set)
10054	WARN	(Cookie Without SameSite Attribute)
10010	WARN	(Cookie No HttpOnly Flag)
10011	WARN	(Cookie Without Secure Flag)
40012	WARN	(Cross Site Scripting (Reflected))
40014	WARN	(Cross Site Scripting (Persistent))
40018	WARN	(SQL Injection)
90019	WARN	(Server Side Code Injection)
90020	WARN	(Remote OS Command Injection)
