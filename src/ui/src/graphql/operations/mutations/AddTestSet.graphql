mutation AddTestSet($name: String!, $description: String, $filePattern: String!, $bucketType: String!, $fileCount: Int!, $modifiedAfter: String, $documentClassType: DocumentClassType) {
  addTestSet(name: $name, description: $description, filePattern: $filePattern, bucketType: $bucketType, fileCount: $fileCount, modifiedAfter: $modifiedAfter, documentClassType: $documentClassType) {
    id
    name
    description
    filePattern
    fileCount
    createdAt
    documentClassType
  }
}
